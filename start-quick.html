<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get customers who text you · TexContractor</title>
<meta name="description" content="List your service free in under a minute. Customers near you text you directly. No lead fees.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#075c4b;--g2:#0a7a63;--y:#F2B731;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f7f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{width:36px;height:36px;border:0;border-radius:10px;background:#f1f5f9;font-size:20px;cursor:pointer;visibility:hidden}
.logo{height:34px;margin:0 auto}
.lang{display:flex;gap:4px;background:#f1f5f9;border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;border-radius:99px;padding:5px 9px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer;color:#334155}
.lang button[aria-pressed=true]{background:var(--g);color:#fff}
.prog{height:5px;background:#e8eef0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:width .35s}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.step{display:none;animation:in .3s ease}.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{display:inline-block;background:#fff4d6;color:#8a5a00;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;margin-bottom:10px}
h1{font-size:1.65rem;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 6px 10px;text-align:center;cursor:pointer;font:inherit;font-weight:700;font-size:.82rem;color:var(--ink);transition:.15s}
.tile img{width:100%;max-width:92px;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin:0 auto 6px;background:#eef2f1}
.tile:hover{border-color:var(--g2)}.tile.sel{border-color:var(--g);background:#ecf7f3}
.tile.more{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--g)}
.tile.more b{font-size:1.8rem;line-height:1}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;font-weight:700;font-size:1rem;text-align:left;cursor:pointer;color:var(--ink)}
.opt .e{font-size:1.35rem;width:28px;text-align:center}
.opt:hover{border-color:var(--g2)}.opt.sel{border-color:var(--g);background:#ecf7f3}
.field{display:block;width:100%;font:inherit;font-size:1.15rem;padding:15px 16px;border:2px solid var(--line);border-radius:14px;background:#fff}
.field:focus{outline:none;border-color:var(--g)}
select.field{appearance:auto}
.cta{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:1.08rem;padding:16px;cursor:pointer;box-shadow:0 6px 16px rgba(7,92,75,.25)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.cta.ghost{background:#fff;color:var(--g);border:2px solid var(--g);box-shadow:none;text-align:center;text-decoration:none}
.live{margin-top:14px;background:#0f172a;border-radius:20px;padding:8px;box-shadow:0 10px 26px rgba(15,23,42,.18)}
.livebar{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:.78rem;font-weight:800;padding:2px 6px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.livewin{position:relative;height:300px;overflow:hidden;border-radius:14px;background:#fff}
.livewin iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.liveshield{position:absolute;inset:0}
.cta.y{background:var(--y);color:#101828;box-shadow:0 6px 16px rgba(242,183,49,.35)}
.card{background:#fff;border-radius:18px;padding:20px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.06)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.cmp div{border-radius:14px;padding:14px;font-size:.9rem;line-height:1.4}
.cmp .bad{background:#fff1f0;color:#7a271a}.cmp .good{background:#ecf7f3;color:#064e3b}
.cmp b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.chat{background:#f1f5f9;border-radius:16px;padding:14px;margin-top:12px}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:.9rem;max-width:85%;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.me{background:var(--g);color:#fff;border-radius:14px 14px 4px 14px;margin:8px 0 0 auto}
.load{text-align:center;padding:26px 6px}
.ring{width:84px;height:84px;border-radius:50%;border:8px solid #e2ece9;border-top-color:var(--g);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.checks{list-style:none;padding:0;margin:14px auto 0;max-width:320px;text-align:left}
.checks li{padding:7px 0;color:#94a3b8;font-weight:700;transition:.3s}.checks li.ok{color:var(--g)}
.checks li::before{content:"○ ";}.checks li.ok::before{content:"✓ "}
.prof{display:flex;gap:14px;align-items:center}
.prof img{width:76px;height:76px;border-radius:16px;object-fit:cover}
.prof h3{margin:0 0 4px;font-size:1.1rem}.prof p{margin:0;color:var(--mut);font-size:.9rem}
.badge{display:inline-block;background:#ecf7f3;color:var(--g);font-weight:800;font-size:.72rem;padding:3px 8px;border-radius:99px;margin-top:6px}
.fine{color:var(--mut);font-size:.78rem;text-align:center;margin-top:12px}
.note{background:#fff8e6;border:1px solid #f6dfa0;border-radius:12px;padding:12px;font-size:.88rem;margin-top:12px;color:#6b4e00}

[hidden]{display:none!important}
.otp{letter-spacing:.5em;text-align:center;font-size:1.6rem;font-weight:800}
.err{color:#b42318;font-weight:700;font-size:.9rem;margin:10px 2px 0;min-height:1.2em}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 0;font-size:.82rem;color:#475569;line-height:1.4}
.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.chk a{color:var(--g)}
label.lb{display:block;font-weight:800;font-size:.85rem;margin:14px 2px 6px;color:#334155}
.ok{font-size:3rem;line-height:1;margin-bottom:6px}
.small{font-size:.85rem;color:var(--mut);text-align:center;margin-top:14px}
.small a{color:var(--g);font-weight:700}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
</style>
<script src="/tex-readable.js?v=1" defer></script></head>
<body>
<div class="top"><div class="bar">
  <button class="back" id="back" aria-label="Back">‹</button>
  <img class="logo" src="texcontractor-logo.png" alt="TexContractor">
  <div class="lang"><button data-l="en" aria-pressed="true">🇺🇸 EN</button><button data-l="es" aria-pressed="false">🇲🇽 ES</button></div>
</div><div class="prog"><i id="prog"></i></div></div>

<main id="app">
  <section class="step on" data-s="1">
    <span class="kick" data-t="k1"></span>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="s1"></p>
    <div class="grid" id="trades"></div>
  </section>
  <section class="step" data-s="2">
    <span class="kick" data-t="st2"></span>
    <h1 data-t="h2"></h1>
    <p class="sub" data-t="s2"></p>
    <input class="field" id="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="75001">
    <p class="sub" id="zipcity" style="margin:10px 2px 0;font-weight:700;color:#075c4b"></p>
    <div id="cityfb" hidden><label class="lb" for="cityin" data-t="cityL"></label><input class="field" id="cityin" autocomplete="address-level2"></div>
    <button class="cta" id="zipgo" disabled data-t="next"></button>
  </section>
  <section class="step" data-s="3">
    <span class="kick" data-t="st3"></span>
    <h1 data-t="h3"></h1>
    <p class="sub" data-t="s3"></p>
    <label class="lb" for="name" data-t="nameL"></label>
    <input class="field" id="name" autocomplete="name" maxlength="40">
    <label class="lb" for="phone" data-t="phoneL"></label>
    <input class="field" id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(214) 555-0123" maxlength="16">
    <label class="chk"><input type="checkbox" id="agree"><span data-t="agree"></span></label>
    <button class="cta y" id="send" disabled data-t="send" hidden></button>
    <button class="cta" id="google" disabled><span style="background:#fff;border-radius:50%;display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;vertical-align:-6px"><svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6C12.4 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.8c-.5-1.4-.8-3-.8-4.8s.3-3.3.8-4.8l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.7 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg></span><span data-t="google"></span></button>
    <p class="small" style="margin-top:10px"><button class="link" id="useemail" data-t="useEmail"></button></p>
    <p class="err" id="err3" role="alert"></p>
  </section>
  <section class="step" data-s="4">
    <span class="kick" data-t="st4"></span>
    <h1 data-t="h4"></h1>
    <p class="sub" id="s4"></p>
    <input class="field otp" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button class="cta" id="verify" disabled data-t="verify"></button>
    <p class="err" id="err4" role="alert"></p>
    <p class="small"><button class="link" id="resend" data-t="resend"></button> · <button class="link" id="edit" data-t="edit"></button></p>
  </section>
  <section class="step" data-s="5">
    <div class="card" style="text-align:center">
      <div class="ok">✅</div>
      <h1 id="h5"></h1>
      <p class="sub" id="s5"></p>
      <a class="cta" id="seeprof" data-t="seeProf"></a>
      <a class="cta ghost" href="contractor-register.html" data-t="more"></a>
    </div>
  </section>
</main>

(function(){

 en:{k1:'Free for technicians',h1:'Get customers who text you directly',s1:'3 quick steps, under a minute. No lead fees. What is your trade?',

  send:'Text me my code →',sending:'Sending…',google:'Or publish with Google',googleIn:'Publish my free profile',useEmail:'No Google? Use email instead',publishing:'Publishing…',
  st4:'Last step',h4:'Enter the code we texted you',s4:'We sent a 6-digit code to {phone}.',verify:'Publish my free profile',verifying:'Publishing…',resend:'Send a new code',edit:'Change number',resent:'New code sent.',
  h5:'You are live, {name}!',s5:'Customers in {city} can now find you under {trade} and text you directly at {phone}.',seeProf:'See my profile',
  more:'Add a photo, hours and details (optional)',
  errPhone:'Enter a 10-digit U.S. mobile number.',errName:'Enter your name.',errGeneric:'Something went wrong. Please try again.'},

  st2:'Paso 2 de 3',h2:'¿Dónde trabajas?',s2:'Escribe tu código postal para que los clientes cerca de ti te encuentren.',cityL:'Tu ciudad',next:'Continuar',
  st3:'Paso 3 de 3',h3:'¿A qué número te escriben los clientes?',s3:'Te mandamos un código para confirmar tu número. Sin email ni contraseña.',
  nameL:'Tu nombre o apodo',phoneL:'Número de celular',

  send:'Mándame mi código →',sending:'Enviando…',google:'O publicar con Google',googleIn:'Publicar mi perfil gratis',useEmail:'¿Sin Google? Usa tu email',publishing:'Publicando…',
  st4:'Último paso',h4:'Escribe el código que te mandamos',s4:'Mandamos un código de 6 dígitos al {phone}.',verify:'Publicar mi perfil gratis',verifying:'Publicando…',resend:'Mandar otro código',edit:'Cambiar número',resent:'Código nuevo enviado.',
  h5:'¡Ya estás publicado, {name}!',s5:'Los clientes en {city} ya te pueden encontrar en {trade} y escribirte directo al {phone}.',seeProf:'Ver mi perfil',
  more:'Agregar foto, horario y detalles (opcional)',
  errPhone:'Escribe un número de celular de EE. UU. de 10 dígitos.',errName:'Escribe tu nombre.',errGeneric:'Algo salió mal. Intenta de nuevo.'}
};
const TRADES=[
 {s:'Electrical and Wiring Repair',i:'electrical-m1',en:'Electrician',es:'Electricista'},
 {s:'Plumbing Pipe Repair',i:'plumbing-m1',en:'Plumber',es:'Plomero'},
 {s:'Central Air Conditioning Repair or Maintenance',i:'ac-m1',en:'AC & Heating',es:'Aire acondicionado'},
 {s:'Handyman',i:'handyman-f1',en:'Handyman',es:'Handyman'},
 {s:'Interior Painting',i:'painting-m1',en:'Painter',es:'Pintor'},
 {s:'Roof Repair or Maintenance',i:'roofing-m1',en:'Roofer',es:'Techador'},
 {s:'House Cleaning',i:'cleaning-f1',en:'House cleaning',es:'Limpieza'},
 {s:'Outdoor Landscaping and Design',i:'landscaping-m1',en:'Landscaping',es:'Jardinería'},
 {s:'Mobile Auto Mechanic',i:'mechanic-m1',en:'Mobile mechanic',es:'Mecánico'},
 {s:'Tree Trimming and Removal',i:'tree-m1',en:'Tree service',es:'Árboles'},
 {s:'Floor Installation or Replacement',i:'flooring-f1',en:'Flooring',es:'Pisos'}
];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='es'||q==='en')return q;return localStorage.getItem('texcontractor-language')==='es'?'es':'en'}catch(_){return 'en'}})();
const st={step:1,trade:null,zip:'',city:'',state:'',name:'',phone:'',e164:''};
const t=k=>T[L][k]||'';
const fmt=s=>s.replace('{name}',st.name).replace('{city}',st.city||st.zip).replace('{trade}',st.trade?(L==='es'?st.trade.es:st.trade.en):'').replace('{phone}',st.phone);
const ev=(n,p)=>{try{if(typeof gtag==='function')gtag('event',n,p||{})}catch(_){}};
function render(){
 document.documentElement.lang=L;
 $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
 $$('[data-t]').forEach(e=>{const k=e.dataset.t;if(k==='agree')e.innerHTML=t(k);else e.textContent=t(k)});
 const g=$('#trades');g.innerHTML='';
 TRADES.forEach(tr=>{const b=document.createElement('button');b.className='tile'+(st.trade===tr?' sel':'');b.innerHTML='<img src="trade-icons/'+tr.i+'.webp" alt="">'+(L==='es'?tr.es:tr.en);b.onclick=()=>{st.trade=tr;ev('quick_trade',{trade:tr.s});go(2)};g.appendChild(b)});
 const m=document.createElement('button');m.className='tile more';m.innerHTML='<b>+</b>'+(L==='es'?'Otro oficio':'Other trade');m.onclick=()=>{location.href='contractor-register.html'};g.appendChild(m);
 $('#s4').textContent=fmt(t('s4'));$('#h5').textContent=fmt(t('h5'));$('#s5').textContent=fmt(t('s5'));
}
function go(n){st.step=n;$$('.step').forEach(s=>s.classList.toggle('on',+s.dataset.s===n));$('#prog').style.width=(n>=5?100:(n-1)*25+5)+'%';$('#back').style.visibility=(n>1&&n<5)?'visible':'hidden';window.scrollTo(0,0);
 if(n===2)setTimeout(()=>$('#zip').focus(),200);if(n===3)setTimeout(()=>$('#name').focus(),200);if(n===4)setTimeout(()=>$('#code').focus(),200);render()}
$('#back').onclick=()=>go(Math.max(1,st.step-1));
$$('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('texcontractor-language',L)}catch(_){};render()});
// step 2
const zipOk=()=>{$('#zipgo').disabled=!(st.zip.length===5&&(st.city||($('#cityin').value.trim().length>1)))};
$('#zip').addEventListener('input',async e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,5);st.zip=e.target.value;st.city='';st.state='';$('#zipcity').textContent='';$('#cityfb').hidden=true;zipOk();
 if(st.zip.length===5){const z=st.zip;try{const r=await fetch('https://api.zippopotam.us/us/'+z);if(r.ok&&z===st.zip){const d=await r.json();const pl=d.places&&d.places[0];if(pl){st.city=pl['place name'];st.state=pl['state abbreviation'];$('#zipcity').textContent='📍 '+st.city+', '+st.state}}}catch(_){}

$('#zipgo').onclick=()=>{if(!st.city){st.city=$('#cityin').value.trim();st.state=st.state||'TX'}ev('quick_zip',{state:st.state});go(3)};

const digits=v=>String(v||'').replace(/\D/g,'');

const collect3=()=>{st.name=$('#name').value.trim().replace(/\s+/g,' ');st.phone=pretty(digits($('#phone').value))};

  saveDraft();ev('quick_google');TexAuth.signInWithGoogle(RET)};
$('#useemail').onclick=async()=>{collect3();saveDraft();$('#err3').textContent='';
  let ok=false;try{ok=await TexQuickSignup.require({intent:'provider',returnTo:RET,source:'start_quick'})}catch(_){ok=false}
  if(!ok)return;try{const u=await TexAuth.getUser();await publish(u)}catch(e){$('#err3').textContent=(e&&e.message)||t('errGeneric')}};
['#name','#phone'].forEach(s=>$(s).addEventListener('input',can3));$('#agree').addEventListener('change',can3);
async function sendCode(){const b=$('#send');$('#err3').textContent='';st.name=$('#name').value.trim().replace(/\s+/g,' ');st.phone=pretty(digits($('#phone').value));
 if(st.name.length<2){$('#err3').textContent=t('errName');return false}
 b.disabled=true;b.textContent=t('sending');
 try{st.e164=await TexAuth.sendPhoneCode(st.phone,'provider');ev('quick_code_sent');go(4);return true}
 catch(e){$('#err3').textContent=(e&&e.message)||t('errGeneric');return false}
 finally{b.textContent=t('send');can3()}}
$('#send').onclick=sendCode;
// step 4
$('#code').addEventListener('input',e=>{e.target.value=digits(e.target.value).slice(0,6);$('#verify').disabled=e.target.value.length<6});
$('#resend').onclick=async()=>{$('#err4').textContent='';try{await TexAuth.sendPhoneCode(st.phone,'provider');$('#err4').style.color='#075c4b';$('#err4').textContent=t('resent')}catch(e){$('#err4').style.color='';$('#err4').textContent=(e&&e.message)||t('errGeneric')}};
$('#edit').onclick=()=>go(3);
$('#verify').onclick=async()=>{const b=$('#verify');b.disabled=true;b.textContent=t('verifying');$('#err4').style.color='';$('#err4').textContent='';
 try{const user=await TexAuth.verifyPhoneCode(st.phone,$('#code').value);await publish(user);
 }catch(e){$('#err4').textContent=(e&&e.message)||t('errGeneric');b.disabled=false;b.textContent=t('verify')}};
if(PHONE_OTP){$('#send').hidden=false;$('#google').classList.add('ghost');$('#google').style.marginTop='10px'}
(async()=>{const q=new URLSearchParams(location.search);let u=null;try{u=await TexAuth.getUser()}catch(_){}
 if(u){try{$('#google').lastChild.textContent=t('googleIn')}catch(_){}}
 const d=q.get('resume')?readDraft():null;
 if(d&&u){st.trade=TRADES.find(x=>x.s===d.trade)||null;st.zip=d.zip;st.city=d.city;st.state=d.state;st.name=d.name;st.phone=d.phone;if(d.L)L=d.L;
  if(st.trade){go(3);$('#name').value=st.name;$('#phone').value=st.phone;$('#agree').checked=true;can3();
   try{$('#google').disabled=true;$('#google').lastChild.textContent=t('publishing');await publish(u)}catch(e){$('#err3').textContent=(e&&e.message)||t('errGeneric');$('#google').disabled=false;$('#google').lastChild.textContent=t('googleIn')}}}
})();
render();go(1);
})();
</script>
