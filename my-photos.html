<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My photos &amp; work · TexContractor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#075c4b;--gold:#c99a3a;--ink:#0f172a;--mut:#475569;--line:#e7dcc4;--bg:#fbf8f1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:18px 16px 40px;display:flex;justify-content:center}
main{width:100%;max-width:560px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top img{height:42px;display:block}
.lg{display:flex;gap:4px}.lg button{font:800 12px Arial;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}.lg button[aria-pressed=true]{background:#fff4dc;border-color:var(--gold);color:#7a5a00}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,40,0,.06)}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 14px;line-height:1.45}
select,textarea{width:100%;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:120px;resize:vertical}
.me{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.me img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#eee;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.me .ph{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#f3ead6;font-size:2.2rem}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:16px;font:800 1.05rem Arial;cursor:pointer;text-align:center}
.big.gold{background:linear-gradient(180deg,#f4c75a,#d9a43a);color:#2b1d00}.big.green{background:var(--g);color:#fff}
.big:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eee}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:900;cursor:pointer}
.small{color:var(--mut);font-size:.85rem;margin:8px 0 0}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;padding:10px 4px;cursor:pointer}.chk input{width:24px;height:24px;accent-color:#075c4b}
#licnum{width:100%;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:2px 0 10px}
.big.ghost{background:#fff;border:1.5px dashed #c99a3a;color:#3d2f12;font-size:.95rem;margin-top:6px}
.msg{font-weight:800;text-align:center;min-height:1.3em;margin:10px 0 0}.msg.ok{color:var(--g)}.msg.err{color:#b42318}
.links{text-align:center;margin-top:12px}.links a{color:var(--g);font-weight:800}
input[type=file]{display:none}
</style>
<script src="/tex-readable.js?v=20261112p" defer></script>
</head>
<body>
<main>
  <div class="top"><a href="index.html"><img src="texcontractor-logo.png" alt="TexContractor"></a>
    <div class="lg" id="lgsw"><button data-l="en" aria-pressed="true" data-tex-readable="1">EN</button><button data-l="es" aria-pressed="false" data-tex-readable="1">ES</button></div></div>

  <section class="card">
    <h1 data-t="h1"></h1><p class="sub" data-t="s1"></p>
    <p class="claimed" id="claimed" data-t="claimed" hidden style="background:#e8f7ee;border:1px solid #9bd3ae;color:#145c2e;border-radius:12px;padding:12px 14px;font-weight:700;margin:12px 0 0"></p>
    <div id="pickwrap" hidden><select id="listing" aria-label="Listing"></select><p class="small" data-t="pickHint"></p></div>
  </section>

  <section class="card">
    <h2 data-t="photoH"></h2><p class="sub" data-t="photoS"></p>
    <div class="me"><div class="ph" id="ph0">👤</div><img id="ph1" alt="" hidden></div>
    <label class="big gold" for="pfile">📷 <span data-t="photoBtn"></span></label>
    <input id="pfile" type="file" accept="image/*">
    <p class="small" data-t="photoTip"></p>
  </section>

  <section class="card">
    <h2 data-t="workH"></h2><p class="sub" data-t="workS"></p>
    <div class="grid" id="wgrid"></div>
    <label class="big gold" for="wfile">🛠️ <span data-t="workBtn"></span></label>
    <input id="wfile" type="file" accept="image/*" multiple>
    <p class="small" id="wcount"></p>
  </section>

  <section class="card">
    <h2 data-t="aboutH"></h2><p class="sub" data-t="aboutS"></p>
    <textarea id="about" maxlength="1200"></textarea>
  </section>

  <section class="card">
    <h2 data-t="credH"></h2><p class="sub" data-t="credS"></p>
    <label class="chk"><input type="checkbox" id="insured"> <span data-t="insL"></span></label>
    <label class="chk"><input type="checkbox" id="licensed"> <span data-t="licL"></span></label>
    <label class="chk"><input type="checkbox" id="bgchk"> <span data-t="bgL"></span></label>
    <div id="licbox" hidden><input id="licnum" maxlength="40" autocomplete="off"></div>
    <label class="big ghost" for="proof">📄 <span data-t="proofBtn"></span></label>
    <input id="proof" type="file" accept="image/*">
    <p class="small" id="proofst"></p>
    <p class="small" data-t="credNote"></p>
  </section>

  <section class="card">
    <h2 data-t="prH"></h2><p class="sub" data-t="prS"></p>
    <label class="chk"><input type="radio" name="pt" value="hourly"> <span data-t="prHour"></span> <span class="pamt">$<input id="pa-hourly" type="number" min="1" max="100000" inputmode="numeric" placeholder="65"> /hr</span></label>
    <label class="chk"><input type="radio" name="pt" value="starting"> <span data-t="prStart"></span> <span class="pamt">$<input id="pa-starting" type="number" min="1" max="100000" inputmode="numeric" placeholder="150"></span></label>
    <label class="chk"><input type="radio" name="pt" value="estimate"> <span data-t="prEst"></span></label>
    <label class="chk"><input type="radio" name="pt" value="deal"> <span data-t="prDeal"></span></label>
    <label class="chk"><input type="radio" name="pt" value=""> <span data-t="prNone"></span></label>
    <style>.pamt{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:800}.pamt input{width:90px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}</style>
  </section>

  <button class="big green" id="save" data-t="save"></button>
  <p class="msg" id="msg" role="status"></p>
  <div class="links"><a id="view" href="#" hidden data-t="view"></a></div>
</main>
<script src="tex-auth.js?v=20261109fin"></script>
<script src="tex-admin.js?v=20261112bg"></script>
<script>
(function(){
'use strict';
const T={
 en:{h1:'My photos & work',s1:'💡 From our experience with customers: they almost always choose the pro whose profile is complete, with a clear photo of you and photos of your work. It builds trust, and it takes 2 minutes.',pickHint:'You have more than one service. Choose which one to update.',
  photoH:'Your profile photo',photoS:'A clear photo of you. Customers see it next to your name.',photoBtn:'Take a photo or choose from my phone',photoTip:'Tip: good light, look at the camera, no sunglasses.',
  workH:'Photos of your work',workS:'Up to 10 photos of jobs you finished.',workBtn:'Add photos of my work',aboutH:'About your work',aboutS:'A few lines: what you do, your experience, the areas you cover.',
  prH:'How do you price your work? (optional)',prS:'Customers see this on your listing.',prHour:'I charge by the hour',prStart:'Jobs start at',prEst:'Free estimate',prDeal:"Contact me, let's make a deal",prNone:"Don't show a price",
  credH:'Insurance, license & background check (optional)',credS:'If you have them, check the boxes. Customers will see a small badge on your profile.',insL:'I\'m insured',bgL:'I have a clear background check',licL:'I\'m licensed / certified',licPh:'License number (optional)',proofBtn:'Upload proof (optional, private)',proofOk:'✓ Proof uploaded. Only TexContractor can see it.',proofN:'{n} proof file(s) on file (private).',credNote:'You are responsible for this information (see Terms).',save:'Save',saving:'Saving…',saved:'✓ Saved. Customers can see it now.',view:'See my profile →',count:'{n} of 10 photos',
  claimed:'✅ We found your listing by your phone number. It is yours now: change the photo, add your work and save.',needSign:'Please sign in first.',noListing:'You don\'t have a service yet.',err:'Something went wrong. Please try again.',max:'Up to 10 work photos.'},
 es:{h1:'Mis fotos y trabajos',s1:'💡 Por nuestra experiencia con los clientes: casi siempre eligen al técnico con el perfil completo, con una foto clara de ti y fotos de tus trabajos. Da confianza, y te toma 2 minutos.',pickHint:'Tienes más de un servicio. Escoge cuál quieres actualizar.',
  photoH:'Tu foto de perfil',photoS:'Una foto clara de ti. Los clientes la ven junto a tu nombre.',photoBtn:'Tomar una foto o escoger de mi teléfono',photoTip:'Consejo: buena luz, mira a la cámara, sin lentes oscuros.',
  workH:'Fotos de tus trabajos',workS:'Hasta 10 fotos de trabajos que terminaste.',workBtn:'Agregar fotos de mis trabajos',aboutH:'Sobre tu trabajo',aboutS:'Unas líneas: qué haces, tu experiencia y las zonas donde trabajas.',
  prH:'¿Cómo cobras tu trabajo? (opcional)',prS:'Los clientes lo ven en tu perfil.',prHour:'Cobro por hora',prStart:'Trabajos desde',prEst:'Presupuesto gratis',prDeal:'Escríbeme y hacemos trato',prNone:'No mostrar precio',
  credH:'Seguro, licencia y antecedentes (opcional)',credS:'Si los tienes, marca las casillas. Los clientes verán una pequeña insignia en tu perfil.',insL:'Tengo seguro',bgL:'Tengo antecedentes limpios (background check)',licL:'Tengo licencia / certificación',licPh:'Número de licencia (opcional)',proofBtn:'Subir comprobante (opcional, privado)',proofOk:'✓ Comprobante subido. Solo TexContractor lo puede ver.',proofN:'{n} comprobante(s) guardado(s) (privado).',credNote:'Tú eres responsable de esta información (ver Términos).',save:'Guardar',saving:'Guardando…',saved:'✓ Guardado. Los clientes ya lo pueden ver.',view:'Ver mi perfil →',count:'{n} de 10 fotos',
  claimed:'✅ Encontramos tu perfil con tu número. Ahora es tuyo: cambia tu foto, agrega tus trabajos y guarda.',needSign:'Primero entra a tu cuenta.',noListing:'Todavía no tienes un servicio.',err:'Algo salió mal. Intenta de nuevo.',max:'Hasta 10 fotos de trabajos.'}
};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q==='es'||q==='en')return q;try{return localStorage.getItem('texcontractor-language')==='es'?'es':'en'}catch(_){return 'en'}})();
const t=k=>T[L][k]||'';
if(new URLSearchParams(location.search).get('claimed')==='1'){const c=document.getElementById('claimed');if(c)c.hidden=false}
const st={rows:[],cur:null,profile:null,profileData:null,work:[],dirty:false,creds:{},proofData:null};
function render(){document.documentElement.lang=L;const ln=document.getElementById('licnum');if(ln)ln.placeholder=T[L].licPh;$$('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));drawWork()}
$$('.lg button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('texcontractor-language',L)}catch(_){};render()});
const msg=(text,cls)=>{const m=$('#msg');m.textContent=text||'';m.className='msg'+(cls?' '+cls:'')};
const url=p=>p?(p.startsWith('data:')?p:TexAdminApi.publicUrl(p)):'';
function readImage(file,max=1200){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function showProfile(){const u=st.profileData||url(st.profile);$('#ph1').hidden=!u;$('#ph0').hidden=!!u;if(u)$('#ph1').src=u}
function drawWork(){const g=$('#wgrid');g.innerHTML='';st.work.forEach((w,i)=>{const d=document.createElement('div');const im=document.createElement('img');im.src=w.data||url(w.path);im.alt='';const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove');x.onclick=()=>{st.work.splice(i,1);st.dirty=true;drawWork()};d.append(im,x);g.append(d)});$('#wcount').textContent=t('count').replace('{n}',st.work.length)}
function loadCreds(id){const c=st.creds[id]||{};$('#insured').checked=!!c.insured;$('#bgchk').checked=!!c.background_check;$('#licensed').checked=!!c.licensed;$('#licnum').value=c.license_number||'';$('#licbox').hidden=!c.licensed;st.proofData=null;$('#proofst').textContent=c.proof_count?t('proofN').replace('{n}',c.proof_count):''}
async function loadPrice(id){$$('input[name=pt]').forEach(r=>r.checked=r.value==='');$('#pa-hourly').value='';$('#pa-starting').value='';
 try{const r=await fetch('https://rryehtaskbjnfbodymjj.supabase.co/rest/v1/texcontractor_public_services?select=price_type,price_amount&id=eq.'+encodeURIComponent(id),{headers:{apikey:'sb_publishable_10LgFmHximAplWyQXKNopw_2peqDb7r'}});const j=await r.json();const p=j&&j[0];if(!p||st.cur?.id!==id)return;
 const t=p.price_type||'';$$('input[name=pt]').forEach(x=>x.checked=x.value===t);if(t==='hourly')$('#pa-hourly').value=p.price_amount||'';if(t==='starting')$('#pa-starting').value=p.price_amount||''}catch(_){}}
function load(row){st.cur=row;loadCreds(row.id);loadPrice(row.id);st.profile=row.profile_photo_path||null;st.profileData=null;st.work=(Array.isArray(row.work_photo_paths)?row.work_photo_paths:[]).map(p=>({path:p}));
 const auto=/^(Contact .+ directly for|Escríbele directo a)/.test(row.about||'');$('#about').value=auto?'':(row.about||'');
 $('#view').href='profile.html?contractor='+encodeURIComponent(row.id);showProfile();drawWork()}
$('#pfile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{st.profileData=await readImage(f,900);st.dirty=true;showProfile();msg('')}catch(_){msg(t('err'),'err')}e.target.value=''});
$('#wfile').addEventListener('change',async e=>{const fs=[...(e.target.files||[])];for(const f of fs){if(st.work.length>=10){msg(t('max'),'err');break}try{st.work.push({data:await readImage(f,1400)})}catch(_){}}st.dirty=true;drawWork();e.target.value=''});
$('#licensed').addEventListener('change',()=>{$('#licbox').hidden=!$('#licensed').checked;st.dirty=true});$('#insured').addEventListener('change',()=>{st.dirty=true});$('#bgchk').addEventListener('change',()=>{st.dirty=true});$('#licnum').addEventListener('input',()=>{st.dirty=true});
$('#proof').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{st.proofData=await readImage(f,1600);st.dirty=true;$('#proofst').textContent='📄 '+f.name}catch(_){msg(t('err'),'err')}e.target.value=''});
$('#listing').addEventListener('change',()=>{const r=st.rows.find(x=>x.id===$('#listing').value);if(r)load(r)});
$('#save').onclick=async()=>{const b=$('#save');if(!st.cur)return;b.disabled=true;b.textContent=t('saving');msg('');
 try{const id=st.cur.id;let profile=null;
  if(st.profileData)profile=await TexAdminApi.uploadMyPhoto(id,st.profileData,'profile');
  const work=[];for(const w of st.work){work.push(w.path||await TexAdminApi.uploadMyPhoto(id,w.data,'work'))}
  const about=$('#about').value.trim();
  await TexAdminApi.myMediaUpdate(id,{profile,work,about:about||null});
  let addProof=null;if(st.proofData)addProof=await TexAdminApi.uploadMyProof(id,st.proofData);
  const ins=$('#insured').checked,bg=$('#bgchk').checked,lic=$('#licensed').checked,num=$('#licnum').value.trim();
  await TexAdminApi.myCredsUpdate(id,{insured:ins,licensed:lic,license:lic?num:null,addProof,background:bg});
  // 11-10 fix: only copy to the person's OTHER services on a personal account (the admin account owns the whole imported directory)
  const fewRows=st.rows.length<=20;
  if(fewRows)for(const r of st.rows)if(r.id!==id){try{await TexAdminApi.myCredsUpdate(r.id,{insured:ins,background:bg})}catch(_){}}
  { const pt=($$('input[name=pt]').find(x=>x.checked)||{}).value||'';const pa=pt==='hourly'?$('#pa-hourly').value:pt==='starting'?$('#pa-starting').value:null;
    if((pt==='hourly'||pt==='starting')&&!(Number(pa)>=1)){throw new Error(L==='es'?'Escribe el precio.':'Enter your price.')}
    await TexAdminApi.myPrice(id,pt,pa); }
  const c=st.creds[id]=st.creds[id]||{};c.insured=ins;c.background_check=bg;c.licensed=lic;c.license_number=lic?num:'';if(addProof){c.proof_count=(c.proof_count||0)+1;st.proofData=null;$('#proofst').textContent=t('proofOk')}
  // same person: use the new profile photo on all of their listings
  if(profile&&fewRows)for(const r of st.rows)if(r.id!==id){try{await TexAdminApi.myMediaUpdate(r.id,{profile})}catch(_){}}
  st.profileData=null;if(profile)st.profile=profile;st.work=work.map(p=>({path:p}));st.dirty=false;drawWork();
  msg(t('saved'),'ok');$('#view').hidden=false;try{if(typeof gtag==='function')gtag('event','my_photos_saved')}catch(_){}
 }catch(e){msg((e&&e.message)||t('err'),'err')}
 finally{b.disabled=false;b.textContent=t('save')}};
window.addEventListener('beforeunload',e=>{if(st.dirty){e.preventDefault();e.returnValue=''}});
render();
(async()=>{let u=null;try{u=await TexAuth.getUser()}catch(_){}
 if(!u){location.replace('signup.html?return_to='+encodeURIComponent('my-photos.html'));return}
 // 11-10 owner: the admin account owns the whole imported directory; this personal page must never edit other people's listings from it
 if(u.id==='6d83440a-820a-4309-b666-cba8e24a8290'){document.querySelectorAll('main section.card').forEach((x,i)=>{if(i>0)x.hidden=true});msg(L==='es'?'Esta es la cuenta de administrador. Esta página es solo para técnicos. Para tu propio negocio, entra con tu cuenta de miembro.':'This is the admin account. This page is only for pros. For your own business, sign in with your member account.','err');const s=$('#save');if(s)s.hidden=true;return}
 try{st.rows=await TexAdminApi.myMedia(null)||[]}catch(e){msg((e&&e.message)||t('err'),'err');return}
 if(!st.rows.length){msg(t('noListing'),'err');$('#save').hidden=true;const a=document.createElement('a');a.href='start.html';a.textContent=L==='es'?'Publicar mi servicio →':'List my service →';$('.links').append(a);return}
 try{(await TexAdminApi.myCreds(null)||[]).forEach(c=>{st.creds[c.id]=c})}catch(_){}
 if(st.rows.length>1){$('#pickwrap').hidden=false;$('#listing').innerHTML='';st.rows.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.service+' · '+r.city;$('#listing').append(o)})}
 const want=new URLSearchParams(location.search).get('id');load(st.rows.find(r=>r.id===want)||st.rows[0]);
})();
})();
</script>
</body>
</html>
