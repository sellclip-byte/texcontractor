<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Are you a pro? Start getting customer texts · TexContractor</title>
<meta name="description" content="Enter your phone number — it's free — and start getting customer requests on TexContractor. No lead fees, no commission.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#075c4b;--y:#F2B731;--ink:#0f172a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06231d;color:#fff;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
/* moving catalog wall */
.wall{position:fixed;inset:-40px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform:rotate(-6deg) scale(1.15);opacity:.95}
.col{display:flex;flex-direction:column;gap:10px;animation:up 60s linear infinite}
.col:nth-child(2){animation-duration:48s;animation-direction:reverse}
.col:nth-child(3){animation-duration:70s}
.col img{width:100%;aspect-ratio:5/3;object-fit:cover;border-radius:14px;display:block}
@keyframes up{to{transform:translateY(-50%)}}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,30,25,.72) 0%,rgba(4,30,25,.30) 30%,rgba(4,30,25,.45) 58%,rgba(4,30,25,.9) 100%)}
/* flying requests */
.fly{position:fixed;z-index:2;pointer-events:none;width:38px;height:32px;filter:drop-shadow(0 0 8px rgba(10,132,255,.9));animation:fl 2.4s cubic-bezier(.5,0,.3,1) forwards}
.fly.call{width:36px;height:36px;filter:drop-shadow(0 0 8px rgba(22,163,74,.9))}
@keyframes fl{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.5)}12%{opacity:1;transform:translate(var(--x0),var(--y0)) scale(1)}88%{opacity:1}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(.6)}}
.ping{position:fixed;z-index:2;width:14px;height:14px;border-radius:50%;border:3px solid #e11d2e;transform:translate(-50%,-50%);animation:pg 1s ease-out forwards;pointer-events:none}
@keyframes pg{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(4)}}
/* content */
.wrap{position:relative;z-index:3;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{height:38px;background:#fff;border-radius:10px;padding:4px 8px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;border-radius:99px;padding:6px 10px;font:inherit;font-size:.74rem;font-weight:800;color:#fff;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--g)}
.hero{margin-top:auto;margin-bottom:auto;padding:20px 0}
.kick{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:#1b1300;font-weight:900;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:99px}
.kick i{width:9px;height:9px;border-radius:50%;background:#e11d2e;animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.2}}
h1{font-size:clamp(2.1rem,9.4vw,3.2rem);line-height:1.05;letter-spacing:-.03em;margin:16px 0 10px;font-weight:900;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.rot{color:var(--y);display:inline-block;min-width:1ch}
.rot::after{content:"";display:inline-block;width:3px;height:.9em;background:var(--y);margin-left:3px;vertical-align:-.08em;animation:bl .8s steps(2,start) infinite}
.lead{font-size:clamp(1.05rem,4.4vw,1.3rem);line-height:1.4;margin:0;color:#e7f3ef;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.lead b{color:#fff}
.chips{margin:14px -20px 0;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.chips div{display:flex;gap:8px;width:max-content;animation:mq 90s linear infinite;padding:3px 0}
.chips div+div{animation-duration:110s;animation-direction:reverse;margin-top:6px}
.chips span{background:rgba(255,255,255,.95);color:#064e3b;font-weight:800;font-size:.82rem;padding:7px 12px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@keyframes mq{to{transform:translateX(-50%)}}
.box{background:#fff;border-radius:22px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);color:var(--ink)}
.box label{display:block;font-weight:900;font-size:1rem;margin:2px 4px 10px}
.row{display:flex;gap:8px;align-items:stretch}
.cc{display:flex;align-items:center;gap:4px;padding:0 9px;border:2px solid #e2e8f0;border-radius:14px;font-weight:800;font-size:1.05rem;background:#f8fafc}
#ph{flex:1;min-width:0;width:100%;font:inherit;font-size:1.2rem;font-weight:800;padding:15px 14px;border:2px solid var(--g);border-radius:14px;outline:none;color:var(--ink);letter-spacing:.02em}
#ph::placeholder{color:#94a3b8;font-weight:700}
#go{border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:900;font-size:1.5rem;padding:0 15px;cursor:pointer;box-shadow:0 6px 16px rgba(7,92,75,.35)}
#go:disabled{opacity:.4;box-shadow:none}
.fine{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 0;font-size:.8rem;font-weight:800;color:#0a7a63}
@media(max-width:400px){#ph{font-size:1.05rem;padding:14px 10px;letter-spacing:0}.cc{padding:0 7px;font-size:.95rem}#go{padding:0 12px}}
.err{color:#b42318;font-weight:700;font-size:.85rem;margin:8px 4px 0;min-height:1em}
.ai{position:fixed;right:10px;bottom:6px;z-index:4;font-size:.62rem;color:rgba(255,255,255,.55)}
</style>
<script src="/tex-readable.js?v=1" defer></script>
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"><div class="col"></div><div class="col"></div><div class="col"></div></div>
<div class="shade"></div>
<div class="wrap">
  <div class="top">
    <img class="logo" src="texcontractor-logo.png" alt="TexContractor">
    <div class="lang"><button data-l="en" aria-pressed="true">🇺🇸 EN</button><button data-l="es" aria-pressed="false">🇲🇽 ES</button></div>
  </div>
  <div class="hero">
    <span class="kick"><i></i><span data-t="kick"></span></span>
    <h1><span data-t="are"></span><br><span class="rot" id="rot"></span></h1>
    <p class="lead" data-t="lead" data-html="1"></p>
    <div class="chips" aria-hidden="true"><div id="ch1"></div><div id="ch2"></div></div>
  </div>
  <form class="box" id="f" autocomplete="on" novalidate>
    <label for="ph" data-t="label"></label>
    <div class="row">
      <span class="cc">🇺🇸 +1</span>
      <input id="ph" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(214) 555-0123" maxlength="16" autofocus>
      <button id="go" type="submit" aria-label="Continue" disabled>→</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="fine"><span data-t="f1"></span><span data-t="f2"></span><span data-t="f3"></span></div>
  </form>
</div>
<div class="ai" data-t="ai"></div>
<script>
(function(){
'use strict';
const T={
 en:{kick:'63 trades · Free for pros',are:'Are you',lead:'Enter your phone number — <b>it\'s free</b> — and start getting these requests.',label:'Enter your phone number',
  f1:'✓ Free',f2:'✓ No lead fees',f3:'✓ No commission',err:'Enter a 10-digit U.S. mobile number.',ai:'Images AI-generated',
  trades:['a plumber?','an electrician?','a handyman?','a house cleaner?','a painter?','a landscaper?','a roofer?','a mechanic?','a mover?','a welder?','a locksmith?','a pool cleaner?','a dog groomer?','a barber?','a DJ?','a photographer?','a tutor?','a notary?','a babysitter?','a pro?']},
 es:{kick:'63 oficios · Gratis',are:'¿Eres',lead:'Escribe tu número de teléfono — <b>es gratis</b> — y empieza a recibir estos pedidos.',label:'Escribe tu número de teléfono',
  f1:'✓ Gratis',f2:'✓ Sin pagar por cliente',f3:'✓ Sin comisión',err:'Escribe un número de celular de EE. UU. de 10 dígitos.',ai:'Imágenes creadas con IA',
  trades:['plomero?','electricista?','handyman?','de limpieza?','pintor?','jardinero?','techador?','mecánico?','de mudanzas?','soldador?','cerrajero?','de albercas?','peluquero?','barbero?','DJ?','fotógrafo?','tutor?','notario?','niñera?','técnico?']}
};
const $=s=>document.querySelector(s);
let L=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='es'||q==='en')return q;const v=localStorage.getItem('texcontractor-language');if(v==='es'||v==='en')return v;return /^es/i.test(navigator.language||'')?'es':'en'}catch(_){return 'en'}})();
const ev=(n,p)=>{try{if(typeof gtag==='function')gtag('event',n,p||{})}catch(_){}};
// catalog wall
const IMGS='069f7430dc62283e 15e5b518293a6f0d 1a57bc6c2a550ffc 1d7880b1f7cc4a97 2531c18af707a760 2a6cff22a3d3096b 370a36b16e14a844 3e2728b4a169e8a1 41c6fdd548fb7e0c 429347c54d44faf4 47beecb13de3728d 488c391d28046099 4bdc9e30bd918933 557f9ac499c88c4f 5851c4d94d520413 5c6b851899f29325 62d3a83557173a13 6ad88b6bcd342352 6ae2f86a9d0b8335 71543b0f03b43866 761209465a696f45 76e0085f66d7a39f 78d2fd185f657a43 7ab5f09a80134d22 8b345eccbc25c558 8d5fa64a39d67893 8f4ca9b92c014783 9131a50c8292b672 98d2c8f81847aa2d a78160bc9259cc61 general-labor'.split(' ');
[...document.querySelectorAll('.col')].forEach((c,i)=>{const list=IMGS.filter((_,k)=>k%3===i);const html=list.map(n=>'<img src="images/home/catalog-'+n+'.jpg" alt="" loading="'+(i<2?'eager':'lazy')+'">').join('');c.innerHTML=html+html});
// texts
const CH={en:["AC & heating", "Electrical", "Plumbing", "Handyman", "House cleaning", "Painting", "Roofing", "Landscaping", "Tree trimming", "Moving", "Junk removal", "Garage doors", "Locksmith", "Flooring", "Concrete", "Fences", "Drywall", "Pest control", "Pressure washing", "Carpet cleaning", "Pool cleaning", "Appliance repair", "Auto mechanic", "Auto detailing", "Towing & tires", "Welding & metalwork", "Windows", "Doors", "Lighting", "Gutters", "TV mounting", "Furniture assembly", "Bathroom remodel", "Decks & porches", "Foundation repair", "General contracting", "Home inspection", "Interior design", "Architecture", "Computer repair", "Notary", "Dog grooming", "Dog training", "Personal training", "DJ", "Photography", "Event makeup", "Event planning", "Wedding officiant", "Tutoring", "Babysitting", "In-home nursing", "Meal prep", "Barber & hair", "Private taxi", "Mower repair", "General labor", "Window tinting", "Upholstery cleaning", "Heating", "Drain repair", "Furniture moving", "Horse riding lessons"],es:["Aire y calefacción", "Electricidad", "Plomería", "Handyman", "Limpieza de casas", "Pintura", "Techos", "Jardinería", "Poda de árboles", "Mudanzas", "Retiro de basura", "Puertas de garaje", "Cerrajería", "Pisos", "Concreto", "Cercas", "Drywall", "Control de plagas", "Lavado a presión", "Limpieza de alfombras", "Limpieza de albercas", "Reparación de electrodomésticos", "Mecánico", "Detallado de autos", "Grúa y llantas", "Soldadura", "Ventanas", "Puertas", "Iluminación", "Canaletas", "Montaje de TV", "Armado de muebles", "Remodelación de baños", "Terrazas y porches", "Cimientos", "Contratista general", "Inspección de casas", "Diseño de interiores", "Arquitectura", "Reparación de computadoras", "Notario", "Peluquería canina", "Entrenamiento de perros", "Entrenador personal", "DJ", "Fotografía", "Maquillaje para eventos", "Planeación de eventos", "Oficiante de bodas", "Tutorías", "Niñera", "Enfermería en casa", "Comida especial", "Barbería", "Taxi privado", "Reparación de podadoras", "Ayudante general", "Polarizado", "Limpieza de muebles", "Calefacción", "Destapado de drenajes", "Movimiento de muebles", "Clases de equitación"]};
let rotTimer;
function render(){
  document.documentElement.lang=L;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.querySelectorAll('[data-t]').forEach(e=>{const v=T[L][e.dataset.t];if(e.dataset.html)e.innerHTML=v;else e.textContent=v});
  const ch=CH[L],h=Math.ceil(ch.length/2),mk=a=>{const x=a.map(t=>'<span>'+t+'</span>').join('');return x+x};document.getElementById('ch1').innerHTML=mk(ch.slice(0,h));document.getElementById('ch2').innerHTML=mk(ch.slice(h));
  clearTimeout(rotTimer);let i=0,j=0,del=false;const el=$('#rot');
  (function step(){const w=T[L].trades[i];if(!del){j++;el.textContent=w.slice(0,j);if(j===w.length){del=true;rotTimer=setTimeout(step,1300);return}}
    else{j--;el.textContent=w.slice(0,j);if(j===0){del=false;i=(i+1)%T[L].trades.length}}rotTimer=setTimeout(step,del?35:75)})();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('texcontractor-language',L)}catch(_){}render();$('#ph').focus()});
// requests flying across the catalog wall
const MSG='<svg viewBox="0 0 22 18" width="38" height="32"><path d="M3 1h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="#0a84ff" stroke="#fff" stroke-width="1.5"/><circle cx="7" cy="7" r="1.3" fill="#fff"/><circle cx="11" cy="7" r="1.3" fill="#fff"/><circle cx="15" cy="7" r="1.3" fill="#fff"/></svg>';
const CALL='<svg viewBox="0 0 22 22" width="36" height="36"><circle cx="11" cy="11" r="10" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><path d="M7.4 5.8c.4-.4 1-.4 1.3 0l1.3 1.6c.3.4.3.9 0 1.2l-.8.8c.6 1.3 1.7 2.4 3 3l.8-.8c.3-.3.8-.3 1.2 0l1.6 1.3c.4.3.4.9 0 1.3l-.9.9c-.6.6-1.5.8-2.3.5-2.8-1-5-3.2-6-6-.3-.8-.1-1.7.5-2.3z" fill="#fff"/></svg>';
let n=0;
function fly(){
  if(document.hidden)return;
  const W=innerWidth,H=innerHeight,x0=W*(.1+Math.random()*.8),y0=H*(.12+Math.random()*.25),x1=W*(.1+Math.random()*.8),y1=H*(.3+Math.random()*.3);
  const p=document.createElement('div');p.className='ping';p.style.left=x0+'px';p.style.top=y0+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
  const call=(++n%4===0);const m=document.createElement('div');m.className='fly'+(call?' call':'');m.innerHTML=call?CALL:MSG;
  m.style.left='0';m.style.top='0';m.style.setProperty('--x0',(x0-19)+'px');m.style.setProperty('--y0',(y0-16)+'px');m.style.setProperty('--x1',(x1-19)+'px');m.style.setProperty('--y1',(y1-16)+'px');
  document.body.appendChild(m);setTimeout(()=>m.remove(),2500);
}
if(!(matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){setTimeout(fly,600);setInterval(fly,1500)}else document.querySelectorAll('.col').forEach(c=>c.style.animation='none');
// the one field
const digits=v=>String(v||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
const pretty=d=>d.length<4?d:d.length<7?'('+d.slice(0,3)+') '+d.slice(3):'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6,10);
let typed=false;
$('#ph').addEventListener('input',e=>{const d=digits(e.target.value).slice(0,10);e.target.value=pretty(d);$('#go').disabled=d.length!==10;$('#err').textContent='';if(!typed){typed=true;ev('pro_phone_start')}});
$('#f').addEventListener('submit',e=>{e.preventDefault();const d=digits($('#ph').value);
  if(d.length!==10){$('#err').textContent=T[L].err;return}
  try{sessionStorage.setItem('texcontractor-pro-phone',d)}catch(_){}
  ev('pro_phone_entered');
  location.href='start.html?src=pro&lang='+L+'#ph';
});
render();
})();
</script>
</body>
</html>
