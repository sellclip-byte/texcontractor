name: Staging site checks
on:
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/workflows/site-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-static-site.mjs
