name: Independent GitHub backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'   # weekly (Sunday); keeps ~3 copies
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete repository backup
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          git bundle create "$RUNNER_TEMP/backup/texcontractor-repository.bundle" --all
          git bundle verify "$RUNNER_TEMP/backup/texcontractor-repository.bundle"
          # write the archive outside the folder being archived (it failed with "file changed as we read it")
          tar -czf "$RUNNER_TEMP/backup/texcontractor-site-files.tar.gz" --exclude=.git .
      - name: Store recoverable backup
        uses: actions/upload-artifact@v4
        with:
          name: texcontractor-recovery-backup
          path: |
            ${{ runner.temp }}/backup/texcontractor-repository.bundle
            ${{ runner.temp }}/backup/texcontractor-site-files.tar.gz
          retention-days: 21
