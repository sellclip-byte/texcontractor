name: Deploy staging site to GitHub Pages
on:
  push:
    branches:
      - seo-safe-review-20261011
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: staging-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-static-site.mjs
      - run: node scripts/audit-seo.mjs
      - run: node scripts/generate-service-seo.mjs
      - name: Prepare staging build
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='CNAME' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/contractor.html
          test -s _site/profile.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<link rel="icon" type="image/png" sizes="192x192" href="/texcontractor-icon-192.png">'
          svg = '<link rel="icon" type="image/svg+xml" href="/favicon.svg">'
          if '</head>' not in html.lower():
              raise SystemExit('Homepage has no closing head tag; favicon setup aborted')
          import re
          html = re.sub(r'<link\\b[^>]*\\brel=["\\\'](?:shortcut\\s+)?icon["\\\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'</head>', '  '+svg+'\\n  '+tag+'\\n</head>', html, count=1, flags=re.I)
          p.write_text(html, encoding='utf-8')
          print('Homepage favicon links set in published artifact')
          PY
          test -s _site/favicon.svg
          test -s _site/texcontractor-icon-192.png
          echo 'Verified: favicon.svg and PNG icon included in published Pages artifact'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
