name: Deploy staging site to GitHub Pages
on:
  push:
    branches:
      - seo-safe-review-20261011
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: staging-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-static-site.mjs
      - run: node scripts/audit-seo.mjs
      - run: node scripts/generate-service-seo.mjs
      - name: Prepare staging build
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='CNAME' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/contractor.html
          test -s _site/profile.html
          test -s _site/favicon.svg
          test -s _site/texcontractor-icon-192.png
          echo 'Verified: favicon.svg and PNG icon included in published Pages artifact'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
