<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18516159223"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="192x192" href="texcontractor-icon-192.png">
  <title>Chat · TexContractor</title>
  <style>
    :root { --ink:#101828; --muted:#667085; --line:#e4e7ec; --soft:#f4f7f5; --green:#0f5132; --green2:#157347; --mine:#157347; --theirs:#fff; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; color:var(--ink); background:var(--soft); font:16px/1.45 Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px)); background:#fff; border-bottom:1px solid var(--line); }
    header img { height:44px; width:auto; display:block; }
    header a.back { text-decoration:none; color:var(--muted); font-weight:700; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
    .app { flex:1; min-height:0; display:grid; grid-template-columns:320px minmax(0,1fr); max-width:1100px; width:100%; margin:0 auto; background:#fff; border-inline:1px solid var(--line); }
    .list { border-right:1px solid var(--line); overflow-y:auto; min-height:0; }
    .list h1 { font-size:18px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); }
    .chat-item { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:#fff; padding:12px 16px; cursor:pointer; font:inherit; color:inherit; }
    .chat-item[aria-current="true"] { background:#eef7f2; }
    .chat-item .who { font-weight:700; display:flex; justify-content:space-between; gap:8px; }
    .chat-item .svc { font-size:13px; color:var(--muted); }
    .chat-item .last { font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dot { min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#d92d20; color:#fff; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
    .thread { display:flex; flex-direction:column; min-height:0; }
    .thread-head { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    .thread-head b { font-size:17px; }
    .thread-head .svc { color:var(--muted); font-size:13px; }
    .thread-head .back-list { display:none; border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 10px; font:inherit; font-weight:700; cursor:pointer; }
    .live { margin-left:auto; font-size:12px; color:var(--green2); font-weight:700; }
    .msgs { flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; background:var(--soft); }
    .msg { max-width:78%; padding:9px 12px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 1px rgba(0,0,0,.05); }
    .msg.mine { align-self:flex-end; background:var(--mine); color:#fff; border-bottom-right-radius:4px; }
    .msg.theirs { align-self:flex-start; background:var(--theirs); border:1px solid var(--line); border-bottom-left-radius:4px; }
    .msg time { display:block; font-size:11px; opacity:.75; margin-top:3px; }
    .compose { display:flex; gap:8px; padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px)); border-top:1px solid var(--line); background:#fff; }
    .compose textarea { flex:1; min-width:0; resize:none; height:46px; max-height:140px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; font:inherit; }
    .compose button { border:0; border-radius:12px; padding:0 18px; background:var(--green2); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .compose button:disabled { opacity:.6; }
    .compose .attach { background:#fff; color:var(--green); border:1.5px solid var(--green); padding:0 12px; font-size:20px; }
    .compose .attach[hidden] { display:none; }
    .picked { display:flex; gap:8px; flex-wrap:wrap; padding:8px 12px 0; background:#fff; }
    .picked[hidden] { display:none; }
    .picked figure { position:relative; margin:0; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
    .picked img { width:100%; height:100%; object-fit:cover; display:block; }
    .picked button { position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:14px; line-height:22px; padding:0; cursor:pointer; }
    .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:4px; margin-bottom:4px; min-width:min(240px,60vw); }
    .photos a { display:block; border-radius:10px; overflow:hidden; background:rgba(0,0,0,.08); aspect-ratio:1; }
    .photos img { width:100%; height:100%; object-fit:cover; display:block; }
    .empty { margin:auto; text-align:center; color:var(--muted); padding:24px; max-width:420px; }
    .note { font-size:12px; color:var(--muted); padding:0 16px 8px; }
    .error { color:#b42318; }
    @media (max-width:760px) {
      .app { grid-template-columns:1fr; border:0; }
      .app.open .list { display:none; }
      .app:not(.open) .thread { display:none; }
      .thread-head .back-list { display:inline-block; }
    }
  </style>
</head>
<body>
  <header><a href="index.html" aria-label="TexContractor home"><img src="texcontractor-logo.png" alt="TexContractor" width="132" height="44"></a><a class="back" href="javascript:history.back()">← Back</a></header>
  <main class="app" id="app">
    <section class="list" aria-label="Your chats"><h1>Messages</h1><div id="chat-list"><p class="empty">Loading your chats…</p></div></section>
    <section class="thread" aria-label="Conversation">
      <div class="thread-head"><button class="back-list" id="back-list" type="button">← Chats</button><div><b id="thread-name">Select a chat</b><div class="svc" id="thread-service"></div></div><span class="live" id="live" hidden>● Live</span></div>
      <div class="msgs" id="msgs" aria-live="polite"><p class="empty">Choose a conversation to read and reply.</p></div>
      <p class="note">Keep your conversation here. Never share passwords or payment card numbers in chat.</p>
      <div class="picked" id="picked" hidden></div>
      <form class="compose" id="compose" hidden><button class="attach" id="attach" type="button" title="Add photos" aria-label="Add photos" hidden>📷</button><input id="photo-input" type="file" accept="image/*" multiple hidden><label for="body" class="sr" style="position:absolute;left:-9999px">Message</label><textarea id="body" maxlength="2000" placeholder="Write a message…"></textarea><button type="submit" id="send">Send</button></form>
    </section>
  </main>
  <script src="tex-auth.js?v=20261021-signup"></script>
  <script src="tex-chat.js?v=20261022b"></script>
  <script>
  (async function () {
    const C = window.TexChat;
    const params = new URLSearchParams(location.search);
    const listEl = document.getElementById('chat-list'), msgsEl = document.getElementById('msgs');
    const app = document.getElementById('app'), compose = document.getElementById('compose'), bodyEl = document.getElementById('body');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const when = (iso) => { const d = new Date(iso); const today = new Date().toDateString() === d.toDateString(); return today ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
    const user = window.TexAuth ? await TexAuth.getUser() : null;
    if (!user) { location.href = 'auth.html?return_to=' + encodeURIComponent('chat.html' + location.search); return; }
    const api = async (path, opts = {}) => {
      const t = await C.token();
      const r = await fetch(C.SUPABASE_URL + '/rest/v1/' + path, { ...opts, headers: { ...C.headers(t), ...(opts.headers || {}) } });
      const text = await r.text(); const data = text ? JSON.parse(text) : null;
      if (!r.ok) throw new Error((data && data.message) || 'Chat is not available right now.');
      return data;
    };

    // Came back from sign-up with ?service=…: open (or create) that chat.
    if (params.get('service') && !params.get('c')) {
      try { const id = await C.rpc('texcontractor_start_chat', { p_service_id: params.get('service') }, true); history.replaceState(null, '', 'chat.html?c=' + id); params.set('c', id); }
      catch (e) { listEl.innerHTML = '<p class="empty error">' + esc(e.message) + '</p>'; }
    }

    let chats = [], current = params.get('c'), lastId = 0, unreadBy = {};
    async function loadList() {
      try {
        chats = await api('texcontractor_chats?select=*&order=last_message_at.desc.nullslast,created_at.desc');
        const unread = await api('texcontractor_chat_messages?select=chat_id&read_at=is.null&sender_id=neq.' + user.id);
        unreadBy = {}; (unread || []).forEach((m) => { unreadBy[m.chat_id] = (unreadBy[m.chat_id] || 0) + 1; });
      } catch (e) { listEl.innerHTML = '<p class="empty error">Chat is being set up. Please try again later.</p>'; return; }
      if (!chats.length) { listEl.innerHTML = '<p class="empty">No chats yet. Open a contractor profile and tap <b>Chat</b> to start one.</p>'; return; }
      listEl.innerHTML = chats.map((c) => {
        const other = c.customer_id === user.id ? c.technician_name : c.customer_name;
        const n = c.id === current ? 0 : (unreadBy[c.id] || 0);
        return `<button class="chat-item" data-id="${esc(c.id)}" aria-current="${c.id === current}"><span class="who"><span>${esc(other || 'TexContractor member')}</span>${n ? `<span class="dot">${n}</span>` : ''}</span><span class="svc">${esc(c.service || '')}</span><div class="last">${esc(c.last_message || 'No messages yet')}</div></button>`;
      }).join('');
    }
    function render(rows, append) {
      if (!append) msgsEl.innerHTML = '';
      if (!append && !rows.length) msgsEl.innerHTML = '<p class="empty">Say hello and describe the job: what needs doing, where, and when.</p>';
      const atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
      if (append && rows.length) msgsEl.querySelector('.empty')?.remove();
      rows.forEach((m) => {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.sender_id === user.id ? 'mine' : 'theirs');
        const photos = Array.isArray(m.photo_paths) ? m.photo_paths : [];
        div.innerHTML = (photos.length ? '<div class="photos">' + photos.map((p) => `<a href="#" data-photo="${esc(p)}" target="_blank" rel="noopener"><img alt="Photo" data-photo="${esc(p)}"></a>`).join('') + '</div>' : '') + esc(m.body) + '<time>' + esc(when(m.created_at)) + '</time>';
        if (photos.length) signPhotos(div);
        msgsEl.appendChild(div); lastId = Math.max(lastId, m.id);
      });
      if (!append || atBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    }
    async function openChat(id) {
      current = id; lastId = 0; app.classList.add('open'); compose.hidden = false;
      const c = chats.find((x) => x.id === id);
      document.getElementById('thread-name').textContent = c ? ((c.customer_id === user.id ? c.technician_name : c.customer_name) || 'TexContractor member') : 'Chat';
      document.getElementById('thread-service').textContent = c?.service || '';
      document.getElementById('live').hidden = false;
      history.replaceState(null, '', 'chat.html?c=' + id);
      render(await api('texcontractor_chat_messages?select=*&chat_id=eq.' + id + '&order=id.asc&limit=500'), false);
      C.rpc('texcontractor_chat_mark_read', { p_chat_id: id }, true).catch(() => {});
      listEl.querySelectorAll('.chat-item').forEach((b) => b.setAttribute('aria-current', String(b.dataset.id === id)));
      bodyEl.focus();
    }
    async function poll() {
      if (!current || document.hidden) return;
      try {
        const rows = await api('texcontractor_chat_messages?select=*&chat_id=eq.' + current + '&id=gt.' + lastId + '&order=id.asc');
        if (rows.length) { render(rows, true); if (rows.some((r) => r.sender_id !== user.id)) C.rpc('texcontractor_chat_mark_read', { p_chat_id: current }, true).catch(() => {}); }
      } catch (_) {}
    }
    // ---- Photos: private bucket, signed links that expire after an hour ----
    const BUCKET = 'texcontractor-chat', signed = {};
    async function signPhotos(scope) {
      const els = [...scope.querySelectorAll('[data-photo]')];
      const need = [...new Set(els.map((e) => e.dataset.photo))].filter((p) => !signed[p]);
      if (need.length) {
        try {
          const t = await C.token();
          const r = await fetch(C.SUPABASE_URL + '/storage/v1/object/sign/' + BUCKET, { method: 'POST', headers: C.headers(t), body: JSON.stringify({ expiresIn: 3600, paths: need }) });
          const rows = await r.json();
          (Array.isArray(rows) ? rows : []).forEach((x) => { if (x.signedURL) signed[x.path] = C.SUPABASE_URL + '/storage/v1' + x.signedURL; });
        } catch (_) {}
      }
      els.forEach((e) => { const u = signed[e.dataset.photo]; if (!u) return; if (e.tagName === 'IMG') e.src = u; else e.href = u; });
    }
    async function shrink(file) {
      try {
        const bmp = await createImageBitmap(file);
        const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.85));
        if (blob) return { blob, ext: 'jpg', type: 'image/jpeg' };
      } catch (_) {}
      const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      return { blob: file, ext, type: file.type || 'image/jpeg' };
    }
    async function uploadPhoto(file) {
      const { blob, ext, type } = await shrink(file);
      const path = current + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + ext;
      const t = await C.token();
      const r = await fetch(C.SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path, { method: 'POST', headers: { apikey: C.headers(t).apikey, Authorization: 'Bearer ' + t, 'Content-Type': type, 'x-upsert': 'false' }, body: blob });
      if (!r.ok) throw new Error('A photo could not be uploaded. Try a smaller photo.');
      return path;
    }
    let picked = [];
    const pickedEl = document.getElementById('picked'), attachBtn = document.getElementById('attach'), photoInput = document.getElementById('photo-input');
    function showPicked() {
      pickedEl.hidden = !picked.length;
      pickedEl.innerHTML = picked.map((f, i) => `<figure><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></figure>`).join('');
    }
    attachBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', () => {
      const add = [...photoInput.files].filter((f) => /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name));
      picked = picked.concat(add).slice(0, 6);
      if (add.length && picked.length === 6) alert('You can send up to 6 photos in one message.');
      photoInput.value = ''; showPicked();
    });
    pickedEl.addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (b) { picked.splice(+b.dataset.rm, 1); showPicked(); } });
    // Show the camera button only once the photo feature is installed in the database.
    api('texcontractor_chat_messages?select=photo_paths&limit=0').then(() => { attachBtn.hidden = false; }).catch(() => {});

    listEl.addEventListener('click', (e) => { const b = e.target.closest('.chat-item'); if (b) openChat(b.dataset.id); });
    document.getElementById('back-list').addEventListener('click', () => { app.classList.remove('open'); loadList(); });
    bodyEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); compose.requestSubmit(); } });
    compose.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = bodyEl.value.trim(); if ((!text && !picked.length) || !current) return;
      const btn = document.getElementById('send'); btn.disabled = true; attachBtn.disabled = true;
      try {
        const payload = { chat_id: current, body: text };
        if (picked.length) {
          btn.textContent = 'Sending photos…';
          payload.photo_paths = [];
          for (const f of picked) payload.photo_paths.push(await uploadPhoto(f));
        }
        await api('texcontractor_chat_messages', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(payload) });
        bodyEl.value = ''; picked = []; showPicked(); await poll(); loadList();
      } catch (err) { alert(err.message); } finally { btn.disabled = false; attachBtn.disabled = false; btn.textContent = 'Send'; bodyEl.focus(); }
    });
    await loadList();
    if (current) openChat(current).catch(() => {});
    setInterval(poll, 4000);
    setInterval(() => { if (!document.hidden) loadList(); }, 20000);
  })();
  </script>
</body>
</html>
