<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join TexContractor · Free</title>
<meta name="description" content="Join TexContractor free with just your phone number. Customers find local pros and text them. Technicians list their service in a minute.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#075c4b;--gold:#c99a3a;--ink:#0f172a;--mut:#64748b;--line:#e7dcc4;--bg:#fbf8f1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:22px 16px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(60,40,0,.08);padding:22px 20px 18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top a{display:block}.top img{height:40px;display:block}
.lg{display:flex;gap:4px}.lg button{font:800 11px Arial;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}.lg button[aria-pressed=true]{background:#fff4dc;border-color:var(--gold);color:#7a5a00}
html body #lgsw button[aria-pressed=false],html body #lgsw button[aria-pressed=false]:hover{border:1px solid var(--line)!important;outline:0!important;box-shadow:none!important;color:var(--mut)!important;background:#fff!important}
h1{font-size:1.45rem;line-height:1.2;margin:4px 0 6px}.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.ph{display:flex;gap:8px;margin-bottom:14px}.cc{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;font-weight:800}
.ph input{flex:1;min-width:0;border:2px solid var(--gold);border-radius:14px;padding:15px 14px;font-size:1.15rem;font-weight:700;outline:none;font-family:inherit}
.q{font-weight:800;font-size:.9rem;margin:2px 0 8px;color:#3d2f12}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;background:#fffdf8;text-align:left;cursor:pointer;font:inherit;color:inherit}
.role:disabled{opacity:.6;cursor:wait}
.role .i{font-size:1.5rem}.role b{display:block;margin-top:6px;font-size:1rem}.role small{display:block;color:var(--mut);font-size:.8rem;margin-top:2px}
.role.cust{border-color:#9cc8bd;background:#f2faf7}.role.cust b{color:var(--g)}
.role.tech{border-color:var(--gold);background:#fff8e8}.role.tech b{color:#8a6100}
.role.one{grid-column:1/-1}
.note{color:var(--mut);font-size:.78rem;text-align:center;margin:14px 0 0;line-height:1.45}.note a{color:var(--g)}
.code{width:100%;border:2px solid var(--gold);border-radius:14px;padding:14px;font-size:1.7rem;font-weight:800;letter-spacing:.5em;text-align:center;outline:none;margin:4px 0 14px;font-family:inherit}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:800 1.02rem Arial;text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.gold{background:linear-gradient(180deg,#f4c75a,#d9a43a);color:#2b1d00}.btn.green{background:var(--g);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);margin-top:8px}
.links{display:flex;justify-content:space-between;font-size:.85rem;margin-top:10px}.links button{background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer;padding:0}
.ok{width:58px;height:58px;border-radius:50%;background:#e8f6f1;color:var(--g);display:grid;place-items:center;font-size:1.8rem;margin:2px auto 8px}
.center{text-align:center}
.box{border-radius:14px;padding:12px 14px;font-size:.86rem;line-height:1.45;margin:14px 0 4px}.box.lock{background:#f4f7f6;border:1px dashed #b9cfc8}.box b{display:block;margin-bottom:2px}
.step{font:800 11px Arial;letter-spacing:.05em;text-transform:uppercase;color:#9c6c18;margin-bottom:4px}
.err{color:#b42318;font-weight:700;font-size:.88rem;min-height:1.2em;margin:10px 0 0;text-align:center}
.err.okc{color:var(--g)}
.v{display:none}.v.on{display:block}
/* catalog wall behind the card + bigger layout on computers */
.wall{position:fixed;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;opacity:.22;filter:saturate(.9)}
.wall img{width:100%;height:100%;object-fit:cover;display:block}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(251,248,241,.55),rgba(251,248,241,.92))}
@media(min-width:700px){
 body{align-items:center;padding:40px 24px}
 .wall{grid-template-columns:repeat(6,1fr)}
 .card{max-width:620px;padding:34px 36px 28px;border-radius:26px}
 .top img{height:56px}.lg button{font-size:13px;padding:7px 12px}
 h1{font-size:2.2rem}.sub{font-size:1.12rem;margin-bottom:22px}
 .ph input{font-size:1.4rem;padding:18px 16px}.cc{font-size:1.1rem;padding:0 16px}
 .q{font-size:1.05rem;margin-bottom:12px}
 .roles{gap:16px}.role{padding:24px 20px;border-width:2px}.role .i{font-size:2.2rem}.role b{font-size:1.35rem;margin-top:10px}.role small{font-size:1rem}
 .note{font-size:.9rem}.code{font-size:2.2rem;padding:18px}.btn{font-size:1.15rem;padding:18px}
 .ok{width:74px;height:74px;font-size:2.3rem}.box{font-size:1rem}
}
/* photo role cards */
.role{position:relative;padding:0;overflow:hidden;aspect-ratio:3/4.9;border-width:2px;background:#ddd;display:block;width:100%}
.role img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .3s}
.role:hover img{transform:scale(1.04)}
.role .i{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.role .lbl{position:absolute;left:0;right:0;bottom:0;padding:48px 46px 12px 12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82));color:#fff;text-align:left}
.role .lbl b{display:block;margin:0;font-size:1.15rem;color:#fff}
.role.cust .lbl b{color:#b9f3df}.role.tech .lbl b{color:#ffd877}
.role .lbl small{display:block;color:#f3f3f3;font-size:.82rem;margin-top:2px}
.role .go{position:absolute;right:12px;bottom:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff;color:#111}
.role.cust .go{background:#0a7a63;color:#fff}.role.tech .go{background:#e3b03f;color:#2b1d00}
.role.one{aspect-ratio:16/10}
@media(min-width:700px){.role{aspect-ratio:4/4.3}.role .lbl b{font-size:1.45rem}.role .lbl small{font-size:1rem}.role .i{width:48px;height:48px;font-size:1.6rem}}
</style>
<script src="/tex-readable.js?v=1" defer></script>
</head>
<body>
<div class="wall" aria-hidden="true"><img src="images/home/catalog-069f7430dc62283e.jpg" alt="" loading="lazy"><img src="images/home/catalog-15e5b518293a6f0d.jpg" alt="" loading="lazy"><img src="images/home/catalog-1a57bc6c2a550ffc.jpg" alt="" loading="lazy"><img src="images/home/catalog-1d7880b1f7cc4a97.jpg" alt="" loading="lazy"><img src="images/home/catalog-2531c18af707a760.jpg" alt="" loading="lazy"><img src="images/home/catalog-2a6cff22a3d3096b.jpg" alt="" loading="lazy"><img src="images/home/catalog-370a36b16e14a844.jpg" alt="" loading="lazy"><img src="images/home/catalog-3e2728b4a169e8a1.jpg" alt="" loading="lazy"><img src="images/home/catalog-41c6fdd548fb7e0c.jpg" alt="" loading="lazy"><img src="images/home/catalog-429347c54d44faf4.jpg" alt="" loading="lazy"><img src="images/home/catalog-47beecb13de3728d.jpg" alt="" loading="lazy"><img src="images/home/catalog-488c391d28046099.jpg" alt="" loading="lazy"></div>
<main class="card">
  <div class="top"><a href="index.html" aria-label="TexContractor home"><img src="texcontractor-logo.png" alt="TexContractor"></a>
    <div class="lg" id="lgsw"><button data-l="en" aria-pressed="true" data-tex-readable="1">EN</button><button data-l="es" aria-pressed="false" data-tex-readable="1">ES</button></div></div>

  <section class="v on" id="v1">
    <h1 data-t="h1"></h1><p class="sub" data-t="s1"></p>
    <div class="ph"><div class="cc">🇺🇸 +1</div><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(214) 555-0123" maxlength="16" aria-label="Phone number"></div>
    <div class="q" data-t="iam"></div>
    <div class="roles" id="roles">
      <button class="role cust" type="button" data-r="customer"><img src="auth-customer-640.jpg" alt="" width="640" height="960"><span class="i">🔍</span><span class="lbl"><b data-t="cust"></b><small data-t="custS"></small><span class="go">→</span></span></button>
      <button class="role tech" type="button" data-r="provider"><img src="auth-pro-640.jpg" alt="" width="640" height="960"><span class="i">🛠️</span><span class="lbl"><b data-t="tech"></b><small data-t="techS"></small><span class="go">→</span></span></button>
    </div>
    <p class="err" id="e1" role="alert"></p>
    <p class="note" id="n1"></p>
  </section>

  <section class="v" id="v2">
    <div class="step" data-t="st2"></div><h1 data-t="h2"></h1><p class="sub" id="s2"></p>
    <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Code">
    <button class="btn gold" id="verify" disabled data-t="verify"></button>
    <p class="err" id="e2" role="alert"></p>
    <div class="links"><button type="button" id="edit" data-t="edit"></button><button type="button" id="resend" data-t="resend"></button></div>
  </section>

  <section class="v" id="v3">
    <div class="ok">✓</div><h1 class="center" data-t="h3"></h1><p class="sub center" data-t="s3"></p>
    <a class="btn green" href="index.html#service-catalog" data-t="find"></a>
    <div class="box lock"><b data-t="lockH"></b><span data-t="lockP"></span></div>
    <a class="btn ghost" href="account.html" data-t="addInfo"></a>
  </section>
</main>
<script src="tex-auth.js?v=20261102src"></script>
<script>
(function(){
'use strict';
const T={
 en:{h1:'Join TexContractor, free',s1:'One number. No password, no email.',iam:'I am a…',cust:'Customer',custS:'Looking for a service',tech:'Technician',techS:'Adding my service',
  n1:'We text you a 6-digit code to confirm your number. Already joined? Same box, your code signs you in. By continuing you agree to the <a href="site-guide.html#terms">Terms</a> and <a href="site-guide.html#privacy">Privacy Policy</a>. Msg &amp; data rates may apply.',
  sending:'Sending your code…',st2:'Confirm your number',h2:'Enter the code',s2:'We texted a 6-digit code to {phone}.',verify:'Confirm',verifying:'Checking…',edit:'Change number',resend:'Send a new code',resent:'New code sent.',
  h3:"You're in!",s3:'Search any of 63 services and text the pro directly.',find:'Find a service near me →',lockH:'🔒 Your info stays private',lockP:'Your name, city or email (optional) are only visible to you. We save them so next time is faster.',addInfo:'Add my name & city (optional)',
  signedH:"You're signed in",signedS:'What would you like to do?',errPhone:'Enter a 10-digit U.S. mobile number.',errGeneric:'Something went wrong. Please try again.'},
 es:{h1:'Únete a TexContractor gratis',s1:'Un solo número. Sin contraseña ni email.',iam:'Soy…',cust:'Cliente',custS:'Busco un servicio',tech:'Técnico',techS:'Quiero publicar mi servicio',
  n1:'Te mandamos un código de 6 dígitos para confirmar tu número. ¿Ya tienes cuenta? Usa el mismo número, el código te da acceso. Al continuar aceptas los <a href="site-guide.html#terms">Términos</a> y la <a href="site-guide.html#privacy">Política de privacidad</a>. Pueden aplicar cargos de mensajes.',
  sending:'Enviando tu código…',st2:'Confirma tu número',h2:'Escribe el código',s2:'Mandamos un código de 6 dígitos al {phone}.',verify:'Confirmar',verifying:'Revisando…',edit:'Cambiar número',resend:'Mandar otro código',resent:'Código nuevo enviado.',
  h3:'¡Ya entraste!',s3:'Busca cualquiera de los 63 servicios y escríbele directo al técnico.',find:'Buscar un servicio cerca de mí →',lockH:'🔒 Tu información es privada',lockP:'Tu nombre, ciudad o email (opcional) solo los ves tú. Los guardamos para que la próxima vez sea más rápido.',addInfo:'Agregar mi nombre y ciudad (opcional)',
  signedH:'Ya entraste',signedS:'¿Qué quieres hacer?',errPhone:'Escribe un número de celular de EE. UU. de 10 dígitos.',errGeneric:'Algo salió mal. Intenta de nuevo.'}
};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const q=new URLSearchParams(location.search);
let L=(()=>{const l=q.get('lang');if(l==='es'||l==='en')return l;try{return localStorage.getItem('texcontractor-language')==='es'?'es':'en'}catch(_){return 'en'}})();
const st={phone:'',role:'',signedIn:false};
const t=k=>T[L][k]||'';
const digits=v=>String(v||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
const pretty=d=>d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):d;
const ev=(n,p)=>{try{if(typeof gtag==='function')gtag('event',n,p||{})}catch(_){}};
const onlyPro=q.get('role')==='pro',onlyCust=q.get('role')==='customer';
// where to go after sign-in
const safeReturn=(()=>{const r=q.get('return_to')||'';return /^[a-z0-9_\-./]+\.html([?#][^\s]*)?$/i.test(r)&&!/^\/\//.test(r)?r:''})();
const proNext=()=>'start.html?via=signup'+(L==='es'?'&lang=es':'');

function render(){
  document.documentElement.lang=L;
  $$('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  $$('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});
  $('#n1').innerHTML=st.signedIn?'':t('n1');
  if(st.signedIn){$('#v1 h1').textContent=t('signedH');$('#v1 .sub').textContent=t('signedS');}
  $('#s2').textContent=t('s2').replace('{phone}',pretty(st.phone));
}
function show(id){$$('.v').forEach(v=>v.classList.toggle('on',v.id===id));window.scrollTo(0,0);if(id==='v2')setTimeout(()=>$('#code').focus(),150)}
$$('.lg button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('texcontractor-language',L)}catch(_){};render()});

$('#phone').addEventListener('input',e=>{$('#e1').textContent=''});
async function choose(role){
  st.role=role;ev('signup_role',{role});
  if(st.signedIn){done();return}
  const d=digits($('#phone').value);
  if(d.length!==10){$('#e1').textContent=t('errPhone');$('#phone').focus();return}
  st.phone=d;$$('.role').forEach(b=>b.disabled=true);$('#e1').className='err okc';$('#e1').textContent=t('sending');
  try{await TexAuth.sendPhoneCode(d,role);ev('signup_code_sent',{role});$('#e1').textContent='';render();show('v2')}
  catch(e){$('#e1').className='err';$('#e1').textContent=(e&&e.message)||t('errGeneric')}
  finally{$$('.role').forEach(b=>b.disabled=false)}
}
$$('.role').forEach(b=>b.onclick=()=>choose(b.dataset.r));
$('#phone').addEventListener('keydown',e=>{if(e.key==='Enter'&&(onlyPro||onlyCust))choose(onlyPro?'provider':'customer')});

$('#code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);$('#verify').disabled=e.target.value.length<6;if(e.target.value.length===6)$('#verify').click()});
$('#verify').onclick=async()=>{const b=$('#verify');if(b.dataset.busy)return;b.dataset.busy='1';b.disabled=true;b.textContent=t('verifying');$('#e2').className='err';$('#e2').textContent='';
  try{await TexAuth.verifyPhoneCode(st.phone,$('#code').value);ev('signup_verified',{role:st.role});done()}
  catch(e){$('#e2').textContent=(e&&e.message)||t('errGeneric');b.disabled=false;b.textContent=t('verify')}
  finally{delete b.dataset.busy}};
$('#edit').onclick=()=>{$('#code').value='';show('v1');$('#phone').focus()};
$('#resend').onclick=async()=>{$('#e2').className='err';$('#e2').textContent='';try{await TexAuth.sendPhoneCode(st.phone,st.role);$('#e2').className='err okc';$('#e2').textContent=t('resent')}catch(e){$('#e2').textContent=(e&&e.message)||t('errGeneric')}};

function done(){
  if(st.role==='provider'){location.href=proNext();return}
  if(safeReturn){location.href=safeReturn;return}
  render();show('v3');
}

// phone typed on the banner / pro page
try{const hm=/^#ph=(\d{10})$/.exec(location.hash);if(hm){$('#phone').value=pretty(hm[1]);history.replaceState(null,'',location.pathname+location.search)}
 else{const pp=sessionStorage.getItem('texcontractor-pro-phone');if(pp&&/^\d{10}$/.test(pp))$('#phone').value=pretty(pp)}}catch(_){}
// technician-only entry (ads that target technicians): one button, no question
if(onlyPro){$('.role.cust').remove();$('.role.tech').classList.add('one');$('.q').style.display='none'}
if(onlyCust){$('.role.tech').remove();$('.role.cust').classList.add('one');$('.q').style.display='none'}

render();
(async()=>{let u=null;try{u=await TexAuth.getUser()}catch(_){}
  if(u){st.signedIn=true;$('.ph').style.display='none';$('.q').style.display='none';render()}})();
})();
</script>
</body>
</html>
