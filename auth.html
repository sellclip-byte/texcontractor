<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to TexContractor without a password.">
  <title>Sign in · TexContractor</title>
  <style>
    :root { --ink:#101828; --muted:#667085; --line:#dbe5e2; --green:#075c4b; --gold:#f5b94c; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); background:#fbfcfd; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    .card { width:min(480px,100%); padding:28px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 18px 48px rgba(16,24,40,.10); }
    .brand { display:block; width:190px; margin:0 auto 20px; }
    .brand img { display:block; width:100%; height:auto; }
    h1 { margin:0; text-align:center; font-size:clamp(1.8rem,5vw,2.5rem); letter-spacing:-.05em; }
    .lead { margin:10px auto 24px; color:var(--muted); text-align:center; line-height:1.55; }
    label { display:grid; gap:8px; font-weight:800; }
    input { width:100%; height:48px; padding:0 14px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    input:focus { outline:3px solid rgba(7,92,75,.15); border-color:var(--green); }
    button, .back { width:100%; min-height:48px; border-radius:10px; font:inherit; font-weight:850; cursor:pointer; }
    .primary { margin-top:14px; border:0; color:#fff; background:var(--green); }
    .primary:hover { background:#064c3f; }
    .google { margin-top:10px; border:1px solid #cbd5e1; color:#475569; background:#f8fafc; cursor:not-allowed; }
    .divider { display:flex; align-items:center; gap:10px; margin:20px 0 14px; color:#98a2b3; font-size:.85rem; }
    .divider::before, .divider::after { content:""; height:1px; flex:1; background:var(--line); }
    .message { display:none; margin-top:14px; padding:12px 14px; border-radius:10px; color:#14532d; background:#ecfdf3; font-weight:700; line-height:1.45; }
    .message.error { color:#8a1c13; background:#fff1f0; }
    .message.show { display:block; }
    .back { display:flex; align-items:center; justify-content:center; margin-top:18px; color:var(--green); text-decoration:none; }
    .small { margin:16px 0 0; color:var(--muted); font-size:.86rem; line-height:1.45; text-align:center; }
    .small a { color:var(--green); font-weight:800; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html" aria-label="TexContractor home"><img src="texcontractor-logo.png" alt="TexContractor"></a>
    <h1>Sign in to continue</h1>
    <p class="lead">Use your email to receive a secure one-time link. No password is needed.</p>
    <form id="auth-form">
      <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <button class="primary" type="submit" id="email-submit">Send me a sign-in link</button>
    </form>
    <div class="divider">or</div>
    <button class="google" type="button" disabled title="Google sign-in will be enabled after OAuth setup">Continue with Google</button>
    <p class="small">Google sign-in is being prepared. Email sign-in is ready now. By continuing, you confirm that you control this email address.</p>
    <div class="message" id="message" role="status"></div>
    <a class="back" href="index.html">← Back to TexContractor</a>
  </main>
  <script src="tex-auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const returnTo = TexAuth.safeReturnTo(params.get('return_to') || 'index.html');
    const form = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const submitButton = document.getElementById('email-submit');
    const message = document.getElementById('message');
    const showMessage = (text, isError = false) => { message.textContent = text; message.className = `message show${isError ? ' error' : ''}`; };

    async function continueIfSignedIn() {
      const errorDescription = new URLSearchParams(window.location.hash.slice(1)).get('error_description');
      const captured = TexAuth.captureMagicLinkSession();
      const user = await TexAuth.getUser();
      if (user) {
        window.location.replace(returnTo);
        return true;
      }
      if (captured) showMessage('Your sign-in link could not be verified. Please request a new link.', true);
      if (errorDescription) showMessage(errorDescription, true);
      return false;
    }

    continueIfSignedIn();
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = 'Sending…';
      try {
        await TexAuth.sendMagicLink(emailInput.value, returnTo);
        showMessage('Check your email. The sign-in link is valid for a short time and can be used once.');
      } catch (error) {
        showMessage(error.message, true);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Send me a sign-in link';
      }
    });
  </script>
</body>
</html>
