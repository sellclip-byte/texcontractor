<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get customers who text you · TexContractor</title>
<meta name="description" content="List your service free. Customers near you text you directly. No lead fees.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#075c4b;--g2:#0a7a63;--y:#F2B731;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f7f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{width:36px;height:36px;border:0;border-radius:10px;background:#f1f5f9;font-size:20px;cursor:pointer;visibility:hidden}
.logo{height:34px;margin:0 auto}
.lang{display:flex;gap:4px;background:#f1f5f9;border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;border-radius:99px;padding:5px 9px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer;color:#334155}
.lang button[aria-pressed=true]{background:var(--g);color:#fff}
.prog{height:5px;background:#e8eef0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:width .35s}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.step{display:none;animation:in .3s ease}.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{display:inline-block;background:#fff4d6;color:#8a5a00;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;margin-bottom:10px}
h1{font-size:1.65rem;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 6px 10px;text-align:center;cursor:pointer;font:inherit;font-weight:700;font-size:.82rem;color:var(--ink);transition:.15s}
.tile img{width:100%;max-width:92px;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin:0 auto 6px;background:#eef2f1}
.tile:hover{border-color:var(--g2)}.tile.sel{border-color:var(--g);background:#ecf7f3}
.tile.more{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--g)}
.tile.more b{font-size:1.8rem;line-height:1}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;font-weight:700;font-size:1rem;text-align:left;cursor:pointer;color:var(--ink)}
.opt .e{font-size:1.35rem;width:28px;text-align:center}
.opt:hover{border-color:var(--g2)}.opt.sel{border-color:var(--g);background:#ecf7f3}
.field{display:block;width:100%;font:inherit;font-size:1.15rem;padding:15px 16px;border:2px solid var(--line);border-radius:14px;background:#fff}
.field:focus{outline:none;border-color:var(--g)}
select.field{appearance:auto}
.cta{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:1.08rem;padding:16px;cursor:pointer;box-shadow:0 6px 16px rgba(7,92,75,.25)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.cta.ghost{background:#fff;color:var(--g);border:2px solid var(--g);box-shadow:none;text-align:center;text-decoration:none}
.live{margin-top:14px;background:#0f172a;border-radius:20px;padding:8px;box-shadow:0 10px 26px rgba(15,23,42,.18)}
.livebar{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:.78rem;font-weight:800;padding:2px 6px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.livewin{position:relative;height:300px;overflow:hidden;border-radius:14px;background:#fff}
.livewin iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.liveshield{position:absolute;inset:0}
.cta.y{background:var(--y);color:#101828;box-shadow:0 6px 16px rgba(242,183,49,.35)}
.card{background:#fff;border-radius:18px;padding:20px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.06)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.cmp div{border-radius:14px;padding:14px;font-size:.9rem;line-height:1.4}
.cmp .bad{background:#fff1f0;color:#7a271a}.cmp .good{background:#ecf7f3;color:#064e3b}
.cmp b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.chat{background:#f1f5f9;border-radius:16px;padding:14px;margin-top:12px}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:.9rem;max-width:85%;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.me{background:var(--g);color:#fff;border-radius:14px 14px 4px 14px;margin:8px 0 0 auto}
.load{text-align:center;padding:26px 6px}
.ring{width:84px;height:84px;border-radius:50%;border:8px solid #e2ece9;border-top-color:var(--g);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.checks{list-style:none;padding:0;margin:14px auto 0;max-width:320px;text-align:left}
.checks li{padding:7px 0;color:#94a3b8;font-weight:700;transition:.3s}.checks li.ok{color:var(--g)}
.checks li::before{content:"○ ";}.checks li.ok::before{content:"✓ "}
.prof{display:flex;gap:14px;align-items:center}
.prof img{width:76px;height:76px;border-radius:16px;object-fit:cover}
.prof h3{margin:0 0 4px;font-size:1.1rem}.prof p{margin:0;color:var(--mut);font-size:.9rem}
.badge{display:inline-block;background:#ecf7f3;color:var(--g);font-weight:800;font-size:.72rem;padding:3px 8px;border-radius:99px;margin-top:6px}
.fine{color:var(--mut);font-size:.78rem;text-align:center;margin-top:12px}
.note{background:#fff8e6;border:1px solid #f6dfa0;border-radius:12px;padding:12px;font-size:.88rem;margin-top:12px;color:#6b4e00}

[hidden]{display:none!important}
.otp{letter-spacing:.5em;text-align:center;font-size:1.6rem;font-weight:800}
.err{color:#b42318;font-weight:700;font-size:.9rem;margin:10px 2px 0;min-height:1.2em}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 0;font-size:.82rem;color:#475569;line-height:1.4}
.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.chk a{color:var(--g)}
label.lb{display:block;font-weight:800;font-size:.85rem;margin:14px 2px 6px;color:#334155}
.ok{font-size:3rem;line-height:1;margin-bottom:6px}
.small{font-size:.85rem;color:var(--mut);text-align:center;margin-top:14px}
.small a{color:var(--g);font-weight:700}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

.all{margin-top:14px}.all input{margin-bottom:10px}.alist{display:grid;gap:8px;max-height:58vh;overflow:auto;padding:2px}
.alist button{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);cursor:pointer}
.alist button:hover{border-color:var(--g2)}
.tipbg{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:in .3s ease}
.tip{background:#fff;border-radius:22px;max-width:520px;width:100%;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.tip h2{margin:6px 0 8px;font-size:1.35rem}.tip p{margin:0 0 6px;color:#334155;line-height:1.45}
.tip .ic{display:flex;justify-content:center;gap:10px;font-size:1.9rem;margin-bottom:4px}
@media(min-width:640px){.tipbg{align-items:center}}

/* owner 11-11: phones — pick the trade from a big dark list (no typing), then optionally add your own photo */
.tsel-l{display:block;font-weight:900;color:#0f172a;margin:6px 0 8px;font-size:1.05rem}
select.tsel{font-size:1.15rem;font-weight:900;color:#0f172a;border:3px solid #075c4b;background:#fff;padding:16px 14px;min-height:58px}
.tp-row{display:flex;gap:12px;margin-top:14px}
.tp-box{flex:1;margin:0;border:2px solid #cbd5e1;border-radius:16px;background:#fff;padding:8px;text-align:center;cursor:pointer}
.tp-box img,.tp-prev{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;background:#eef2f1}
.tp-box figcaption,.tp-cap{display:block;margin-top:6px;font-weight:900;color:#0f172a;font-size:.95rem}
.tp-add{border:3px dashed #075c4b;background:#f0fbf7}
.tp-prev{display:flex;align-items:center;justify-content:center;font-size:2.6rem;background-size:cover;background-position:center}
.tp-add.has{border-style:solid}
.tp-note{color:#334155;font-weight:700;margin-top:8px}
.tp-btns{display:flex;gap:10px;margin-top:10px}.tp-b{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:2px solid #075c4b;background:#fff;color:#075c4b;font-weight:900;font-size:1rem;cursor:pointer;text-align:center;padding:6px}.tp-b.cam{background:#075c4b;color:#fff}
.lang button{font-size:1rem;font-weight:900;padding:9px 13px;min-height:42px}

.q2{font-size:1.2rem;margin:22px 0 10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chips.two{grid-template-columns:1fr 1fr}.chips.three{grid-template-columns:repeat(3,1fr)}
#hrChips{grid-template-columns:1fr 1fr}#abChips{grid-template-columns:1fr 1fr;margin-bottom:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 6px;font:inherit;font-weight:800;font-size:1rem;color:var(--ink);cursor:pointer}
.chip.on{border-color:#1d4ed8;background:#1d4ed8;color:#fff}
#abChips .chip{font-size:.88rem;font-weight:700;padding:10px 6px;color:#1d4ed8;border-color:#bfdbfe;background:#eff6ff}
.hr-custom{display:flex;gap:8px;align-items:center;margin-top:10px}.hr-custom .field{padding:12px}
.pp-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp-opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.pp-opt.on{border-color:#1d4ed8;box-shadow:0 0 0 3px #bfdbfe}
.pp-img{width:100%;aspect-ratio:1;border-radius:12px;background:#eef2f6 center/cover;display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden}.pp-img img{width:100%;height:100%;object-fit:cover}
.wk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.wk{position:relative;aspect-ratio:1;border:2px dashed #cbd5e1;border-radius:12px;background:#fff center/cover}.wk.has{border:0}
.wk label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#94a3b8;cursor:pointer}
.wk .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(15,23,42,.75);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.wk-count{margin:10px 2px 0;font-weight:800;color:#b45309}.wk-count.good{color:#15803d}
.money{display:flex;align-items:center;gap:8px}.money b{font-size:1.4rem}
textarea.field{resize:vertical;min-height:110px}
.yn{display:grid;gap:10px}
#tpick .tp-add,#tpick .tp-btns{display:none!important}
section[data-s="12"] a[href="my-photos.html"]{display:none}
</style>

<body>
<div class="top"><div class="bar">
  <button class="back" id="back" aria-label="Back">‹</button>
  <img class="logo" src="texcontractor-logo.png" alt="TexContractor">
  <div class="lang"><button data-l="en" aria-pressed="true">🇺🇸 English</button><button data-l="es" aria-pressed="false">🇲🇽 Español</button></div>
</div><div class="prog"><i id="prog"></i></div></div>

<main id="app" style="visibility:hidden">
  <section class="step on" data-s="1">
    <span class="kick" data-t="k1"></span>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="s1"></p>
    <label class="lb tsel-l" for="tradeSel" data-t="tselL"></label>
    <select class="field tsel" id="tradeSel"></select>
    <div id="tpick" hidden>
      <div class="tp-row">
        <figure class="tp-box"><img id="timg" alt=""><figcaption data-t="ourPic"></figcaption></figure>
        <label class="tp-box tp-add" for="myph"><span class="tp-prev" id="tprev"><b>📷</b></span><span class="tp-cap" id="tpcap"></span><input type="file" id="myph" accept="image/*" hidden></label>
      </div>
      <div class="tp-btns"><label class="tp-b cam" for="mycam">📷 <span data-t="camBtn"></span></label><label class="tp-b" for="myph">🖼️ <span data-t="galBtn"></span></label></div>
      <input type="file" id="mycam" accept="image/*" capture="user" hidden>
      
      <button class="cta" id="t1go" type="button" data-t="next1"></button>
    </div>
    <div class="grid" id="trades" hidden></div>
    <div class="all" id="allbox" hidden><input class="field" id="allq" type="search" autocomplete="off"><div class="alist" id="alist"></div></div>
  </section>
  <section class="step" data-s="2">
    <span class="kick" data-t="st2"></span>
    <h1 data-t="h2"></h1>
    <p class="sub" data-t="s2"></p>
    <input class="field" id="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="75001">
    <p class="sub" id="zipcity" style="margin:10px 2px 0;font-weight:700;color:#075c4b"></p>
    <div id="cityfb" hidden><label class="lb" for="cityin" data-t="cityL"></label><input class="field" id="cityin" autocomplete="address-level2"></div>
    <div id="namebox" hidden><label class="lb" for="name2" data-t="nameL"></label><input class="field" id="name2" autocomplete="name" maxlength="40"></div>
    <div class="wt-pick" style="margin:14px 0 4px"><span class="lb" id="wtL" style="display:block;font-weight:800;margin-bottom:6px">Who do you work for? (tap one or both)</span><div class="wt-row"><label class="wt-opt wt-res"><input type="checkbox" id="wtRes"> <b>🏠 <span id="wtR">Residential</span></b></label><label class="wt-opt wt-com"><input type="checkbox" id="wtCom"> <b>🏢 <span id="wtC">Commercial</span></b></label></div></div>
    <style>.wt-row{display:flex;gap:10px}.wt-opt{flex:1;display:flex;align-items:center;justify-content:center;border:2px solid #e2e8f0;border-radius:12px;padding:12px 8px;cursor:pointer;background:#fff;color:#334155;font-weight:800;position:relative}.wt-opt input{position:absolute;opacity:0;width:1px;height:1px}.wt-res:has(input:checked){border-color:#1d4ed8;background:#1d4ed8;color:#fff}.wt-com:has(input:checked){border-color:#ea580c;background:#ea580c;color:#fff}.wt-opt:has(input:focus-visible){outline:3px solid #93c5fd}</style>
    <p class="err" id="err2" role="alert"></p>
    <button class="cta" id="zipgo" disabled data-t="next"></button>
  </section>
  <section class="step" data-s="3">
    <span class="kick" data-n="k3"></span>
    <h1 data-n="h3"></h1>
    <p class="sub" data-n="s3"></p>
    <div class="pp-row">
      <button type="button" class="pp-opt" id="ppMine"><span class="pp-img" id="ppMineImg"><b>🤳</b></span><span data-n="mine"></span></button>
      <button type="button" class="pp-opt" id="ppOurs"><span class="pp-img"><img id="ppOursImg" alt=""></span><span data-n="ours"></span></button>
    </div>
    <div class="tp-btns" id="ppBtns" hidden><label class="tp-b cam" for="ppCam">📷 <span data-n="cam"></span></label><label class="tp-b" for="ppGal">🖼️ <span data-n="gal"></span></label></div>
    <input type="file" id="ppCam" accept="image/*" capture="user" hidden><input type="file" id="ppGal" accept="image/*" hidden>
    <button class="cta" id="go3" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="4">
    <span class="kick" data-n="k4"></span>
    <h1 data-n="h4"></h1>
    <p class="sub" data-n="s4"></p>
    <div class="tp-btns"><label class="tp-b cam" for="wkCam">📷 <span data-n="cam2"></span></label><label class="tp-b" for="wkGal">🖼️ <span data-n="gal2"></span></label></div>
    <input type="file" id="wkCam" accept="image/*" capture="environment" hidden><input type="file" id="wkGal" accept="image/*" multiple hidden>
    <div class="wk-grid" id="wkGrid"></div>
    <p class="wk-count" id="wkCount"></p>
    <button class="cta" id="go4" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="5">
    <span class="kick" data-n="k5"></span>
    <h1 data-n="h5"></h1>
    <div class="chips" id="yrChips"></div>
    <h2 class="q2" data-n="h5b"></h2>
    <div class="chips two" id="esChips"></div>
    <button class="cta" id="go5" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="6">
    <span class="kick" data-n="k6"></span>
    <h1 data-n="h6"></h1>
    <div class="chips" id="hrChips"></div>
    <div class="hr-custom" id="hrCustom" hidden><select class="field" id="hrFrom"></select><span>–</span><select class="field" id="hrTo"></select></div>
    <h2 class="q2" data-n="h6b"></h2>
    <p class="sub" data-n="s6b" style="margin-bottom:10px"></p>
    <div class="chips three" id="ctChips"></div>
    <button class="cta" id="go6" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="7">
    <span class="kick" data-n="k7"></span>
    <h1 data-n="h7"></h1>
    <p class="sub" data-n="s7"></p>
    <div class="opts" id="prOpts"></div>
    <div id="prAmt" hidden><label class="lb" for="prNum" id="prLab"></label><div class="money"><b>$</b><input class="field" id="prNum" inputmode="numeric" maxlength="6" placeholder="75"></div></div>
    <button class="cta" id="go7" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="8">
    <span class="kick" data-n="k8"></span>
    <h1 data-n="h8"></h1>
    <p class="sub" data-n="s8"></p>
    <div class="yn" id="ynBox"></div>
    <div id="licBox" hidden><label class="lb" for="licNum" data-n="licL"></label><input class="field" id="licNum" maxlength="40" autocomplete="off"></div>
    <button class="cta" id="go8" type="button" data-n="next"></button>
  </section>
  <section class="step" data-s="9">
    <span class="kick" data-n="k9"></span>
    <h1 data-n="h9"></h1>
    <p class="sub" data-n="s9"></p>
    <div class="chips" id="abChips"></div>
    <textarea class="field" id="about" rows="4" maxlength="400"></textarea>
    <p class="wk-count" id="abCount"></p>
    <button class="cta" id="go9" type="button" disabled data-n="next"></button>
  </section>
  <section class="step" data-s="10">
    <span class="kick" data-t="st3"></span>
    <h1 data-t="h3"></h1>
    <p class="sub" data-t="s3"></p>
    <label class="lb" for="name" data-t="nameL"></label>
    <input class="field" id="name" autocomplete="name" maxlength="40">
    <label class="lb" for="phone" data-t="phoneL"></label>
    <input class="field" id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(214) 555-0123" maxlength="16">
