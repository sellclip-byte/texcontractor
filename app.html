<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get the TexContractor App · 3 Easy Steps</title>
<meta name="description" content="No download needed. Put TexContractor on your phone like an app in 3 easy steps, on iPhone or Android.">
<link rel="canonical" href="https://texcontractor.com/app.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Get the TexContractor App in 3 Easy Steps">
<meta property="og:description" content="No download needed. Our website works just like an app on your phone.">
<meta property="og:image" content="https://texcontractor.com/texcontractor-icon-512.png">
<style>
:root{--g:#075c4b;--gold:#c99a3a;--ink:#0f172a;--mut:#475569;--line:#e7dcc4;--bg:#fbf8f1}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:18px 16px 40px;display:flex;justify-content:center}
main{width:100%;max-width:980px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top img{height:44px;display:block}
.lg{display:flex;gap:4px}.lg button{font:800 12px Arial;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}.lg button[aria-pressed=true]{background:#fff4dc;border-color:var(--gold);color:#7a5a00}
.hero{text-align:center;margin:6px 0 18px}
.hero .ic{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15;margin:12px 0 6px}
.sub{color:var(--mut);font-size:1.08rem;margin:0 auto;max-width:620px;line-height:1.45}
.same{display:inline-block;margin-top:12px;background:#e8f6f1;color:var(--g);font-weight:800;border-radius:999px;padding:8px 14px}
.tabs{display:flex;justify-content:center;gap:8px;margin:18px 0}
.tabs button{font:800 1rem Arial;padding:12px 20px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.install{display:block;max-width:420px;margin:0 auto 18px;border:0;border-radius:14px;padding:16px;font:800 1.1rem Arial;background:linear-gradient(180deg,#f4c75a,#d9a43a);color:#2b1d00;cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(60,40,0,.06)}
.num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-weight:900;font-size:1.2rem}
.step h2{font-size:1.2rem;margin:10px 0 4px}.step p{color:var(--mut);margin:0 0 12px;line-height:1.4}
/* phone mockups */
.ph{width:200px;height:360px;margin:0 auto;border-radius:30px;background:#111;padding:10px;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.scr{width:100%;height:100%;border-radius:22px;background:#f5f5f7;overflow:hidden;position:relative;font-size:11px;color:#333}
.bar{position:absolute;left:0;right:0;height:38px;background:#fff;border-color:#ddd;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.bar.b{bottom:0;border-top:1px solid #ddd}.bar.t{top:0;border-bottom:1px solid #ddd;justify-content:space-between}
.url{flex:1;margin:0 6px;background:#eee;border-radius:8px;padding:5px 8px;font-size:10px;color:#555;text-align:center}
.pg{position:absolute;left:10px;right:10px;top:50px;bottom:50px;display:flex;flex-direction:column;gap:7px}
.pg i{display:block;height:10px;border-radius:5px;background:#ddd}.pg i.w{width:60%}.pg .logo{height:26px;background:#e9dcbc}
.ico{width:22px;height:22px;display:grid;place-items:center;font-size:15px;color:#007aff}
.hl{outline:3px solid #ff3b30;outline-offset:2px;border-radius:8px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:rgba(255,59,48,.25)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:12px 10px}
.sheet div{padding:9px 8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11.5px}
.menu{position:absolute;right:6px;top:40px;width:150px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px 0}
.menu div{padding:8px 10px;font-size:11px}
.home{position:absolute;inset:0;background:linear-gradient(160deg,#4a6fa5,#9b6bb3);padding:30px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start}
.app{text-align:center;color:#fff;font-size:8.5px}.app span{display:block;width:34px;height:34px;margin:0 auto 3px;border-radius:9px;background:rgba(255,255,255,.35)}
.app.tc span{background:#fff url(texcontractor-icon-192.png) center/cover}
.arrow{position:absolute;font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.note{max-width:720px;margin:20px auto 0;background:#fff;border:1px dashed #cdbb8c;border-radius:16px;padding:14px 16px;color:var(--mut);line-height:1.5;text-align:center}
.cta{display:block;max-width:420px;margin:18px auto 0;text-align:center;background:var(--g);color:#fff;font-weight:800;padding:15px;border-radius:14px;text-decoration:none}
@media(max-width:820px){.steps{grid-template-columns:1fr}.ph{width:190px;height:340px}}
</style>
<script src="/tex-readable.js?v=20261112o" defer></script>
</head>
<body>
<main>
  <div class="top"><a href="index.html"><img src="texcontractor-logo.png" alt="TexContractor"></a>
    <div class="lg" id="lgsw"><button data-l="en" aria-pressed="true" data-tex-readable="1">EN</button><button data-l="es" aria-pressed="false" data-tex-readable="1">ES</button></div></div>

  <section class="hero">
    <img class="ic" src="texcontractor-icon-192.png" alt="">
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="s1"></p>
    <span class="same" data-t="same"></span>
  </section>

  <div class="tabs" role="group"><button data-os="ios" aria-pressed="true">🍎 iPhone</button><button data-os="android" aria-pressed="false">🤖 Android</button></div>
  <button class="install" id="install" hidden data-t="installBtn"></button>

  <section class="steps" id="ios">
    <div class="step"><span class="num">1</span><h2 data-t="i1h"></h2><p data-t="i1p"></p>
      <div class="ph"><div class="scr"><div class="pg"><i class="logo"></i><i></i><i class="w"></i><i></i><i class="w"></i><i></i></div>
        <div class="bar b"><span class="ico">‹</span><span class="ico">›</span><span class="ico hl">⬆︎</span><span class="ico">📖</span><span class="ico">⧉</span></div>
        <span class="arrow" style="left:84px;bottom:44px">👇</span></div></div></div>
    <div class="step"><span class="num">2</span><h2 data-t="i2h"></h2><p data-t="i2p"></p>
      <div class="ph"><div class="scr"><div class="pg"><i class="logo"></i><i></i><i class="w"></i></div>
        <div class="sheet"><div><span>Copy</span><span>⧉</span></div><div><span>Add to Favorites</span><span>☆</span></div><div class="hl"><b data-t="addHome"></b><span>⊞</span></div><div><span>Find on Page</span><span>🔍</span></div></div></div></div></div>
    <div class="step"><span class="num">3</span><h2 data-t="i3h"></h2><p data-t="i3p"></p>
      <div class="ph"><div class="scr"><div class="home"><div class="app"><span></span>Mail</div><div class="app"><span></span>Photos</div><div class="app"><span></span>Maps</div><div class="app"><span></span>Clock</div><div class="app"><span></span>Notes</div><div class="app tc hl"><span></span>TexContractor</div><div class="app"><span></span>Music</div><div class="app"><span></span>Camera</div></div></div></div></div>
  </section>

  <section class="steps" id="android" hidden>
    <div class="step"><span class="num">1</span><h2 data-t="a1h"></h2><p data-t="a1p"></p>
      <div class="ph"><div class="scr"><div class="bar t"><span class="ico">⌂</span><span class="url">texcontractor.com</span><span class="ico hl" style="color:#333;font-weight:900">⋮</span></div>
        <div class="pg"><i class="logo"></i><i></i><i class="w"></i><i></i><i class="w"></i><i></i></div><span class="arrow" style="right:2px;top:40px">👆</span></div></div></div>
    <div class="step"><span class="num">2</span><h2 data-t="a2h"></h2><p data-t="a2p"></p>
      <div class="ph"><div class="scr"><div class="bar t"><span class="ico">⌂</span><span class="url">texcontractor.com</span><span class="ico" style="color:#333">⋮</span></div>
        <div class="pg"><i class="logo"></i><i></i></div>
        <div class="menu"><div>New tab</div><div>History</div><div>Bookmarks</div><div class="hl"><b data-t="addHomeA"></b></div><div>Settings</div></div></div></div></div>
    <div class="step"><span class="num">3</span><h2 data-t="i3h"></h2><p data-t="i3p"></p>
      <div class="ph"><div class="scr"><div class="home"><div class="app"><span></span>Gmail</div><div class="app"><span></span>Photos</div><div class="app"><span></span>Maps</div><div class="app"><span></span>Clock</div><div class="app"><span></span>Phone</div><div class="app tc hl"><span></span>TexContractor</div><div class="app"><span></span>Music</div><div class="app"><span></span>Camera</div></div></div></div></div>
  </section>

  <p class="note" data-t="note"></p>
  <a class="cta" href="index.html" data-t="cta"></a>
</main>
<script>
(function(){
'use strict';
const T={
 en:{h1:'Get the TexContractor app in 3 easy steps',s1:'No download, no app store. Our website works just like an app on your phone.',same:'✓ Website = App · Free',
  installBtn:'📲 Install the app now',
  i1h:'Tap Share',i1p:'Open texcontractor.com in Safari and tap the Share button ⬆︎ at the bottom. (On some iPhones tap ••• first.)',
  i2h:'Tap “Add to Home Screen”',i2p:'Scroll down the list and tap “Add to Home Screen”, then tap Add.',addHome:'Add to Home Screen',
  i3h:'Done! Open it like an app',i3p:'The TexContractor icon is now on your home screen. Tap it any time.',
  a1h:'Tap the 3 dots',a1p:'Open texcontractor.com in Chrome and tap the 3 dots ⋮ at the top right.',
  a2h:'Tap “Add to Home screen”',a2p:'Tap “Add to Home screen” or “Install app”, then tap Add / Install.',addHomeA:'Add to Home screen',
  note:'It is the same TexContractor you know, just one tap away. No updates to install and it does not take space on your phone.',cta:'Go to TexContractor →'},
 es:{h1:'Ten la app de TexContractor en 3 pasos fáciles',s1:'Sin descargar nada y sin tienda de apps. Nuestra página funciona igual que una app en tu teléfono.',same:'✓ Página web = App · Gratis',
  installBtn:'📲 Instalar la app ahora',
  i1h:'Toca Compartir',i1p:'Abre texcontractor.com en Safari y toca el botón Compartir ⬆︎ abajo. (En algunos iPhone toca ••• primero.)',
  i2h:'Toca “Agregar a inicio”',i2p:'Baja en la lista y toca “Agregar a pantalla de inicio”, luego toca Agregar.',addHome:'Agregar a inicio',
  i3h:'¡Listo! Ábrela como una app',i3p:'El ícono de TexContractor ya está en tu pantalla de inicio. Tócalo cuando quieras.',
  a1h:'Toca los 3 puntos',a1p:'Abre texcontractor.com en Chrome y toca los 3 puntos ⋮ arriba a la derecha.',
  a2h:'Toca “Agregar a la pantalla principal”',a2p:'Toca “Agregar a la pantalla principal” o “Instalar app”, luego toca Agregar / Instalar.',addHomeA:'Agregar a pantalla principal',
  note:'Es el mismo TexContractor de siempre, a un toque. No hay que instalar actualizaciones y no ocupa espacio en tu teléfono.',cta:'Ir a TexContractor →'}
};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q==='es'||q==='en')return q;try{const v=localStorage.getItem('texcontractor-language');if(v)return v==='es'?'es':'en'}catch(_){}return /^es/i.test(navigator.language||'')?'es':'en'})();
let OS=/android/i.test(navigator.userAgent)?'android':'ios';
function render(){document.documentElement.lang=L;$$('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));$$('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]||'');
 $$('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.os===OS));$('#ios').hidden=OS!=='ios';$('#android').hidden=OS!=='android'}
$$('.lg button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('texcontractor-language',L)}catch(_){};render()});
$$('.tabs button').forEach(b=>b.onclick=()=>{OS=b.dataset.os;render()});
// Android / Chrome: real one-tap install when the browser offers it
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});
$('#install').onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(_){}deferred=null;$('#install').hidden=true};
try{if(typeof gtag==='function')gtag('event','app_page_view',{os:OS})}catch(_){}
render();
})();
</script>
</body>
</html>
